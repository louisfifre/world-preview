<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%237fb850' d='M16 2l14 7-14 7L2 9z'/%3E%3Cpath fill='%238b6344' d='M2 9l14 7v14L2 23z'/%3E%3Cpath fill='%236b4b33' d='M30 9l-14 7v14l14-7z'/%3E%3C/svg%3E">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  /* Two grounds, following the system: pure black, or a white that is almost white.
     Nothing else is filled and no line is coloured: what is current is underlined in the colour of
     the text. The map and the button are the only coloured surfaces of the page. */
  :root {
    color-scheme: dark;
    --ground: #000;
    --line: #2a2a2a;
    --text: #ececec;
    --muted: #8a8a8a;
    --warn: #e5a44e;
    --grid: rgba(255, 255, 255, 0.16);
    --track: #6a6a6a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --ground: #fafaf8;
      --line: #deded9;
      --text: #171717;
      --muted: #707070;
      --warn: #a85d00;
      --grid: rgba(0, 0, 0, 0.12);
      --track: #9a9a96;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 24px 28px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 310px minmax(0, 1fr) 320px;
    gap: 28px;
    background: var(--ground);
    color: var(--text);
    font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  /* A narrow window takes its width from the map first, then from the list on the right. The left
     column keeps room for a hint under each slider on one or two lines: without them a slider is only a name. */
  @media (max-width: 1250px) {
    body { grid-template-columns: 284px minmax(0, 1fr) 264px; gap: 24px; padding: 22px 22px; }
  }
  @media (max-width: 1100px) {
    body { grid-template-columns: 262px minmax(0, 1fr) 250px; gap: 20px; padding: 18px 16px; }
    .choice { gap: 14px; }
  }
  /* One scale for the whole page, four sizes: 16 for a title, 14 for what is read, 13 for rows and labels,
     12 for notes and the heads of columns. A title is larger and heavier than what it heads and has room
     above it: no capitals, no second colour. One step above, 18, is kept for the figures that answer the goal. */
  h2 { margin: 0 0 8px; font-size: 16px; line-height: 1.25; font-weight: 600; }
  .column { min-height: 0; display: flex; flex-direction: column; gap: 22px; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  small { font-size: 12px; color: var(--muted); }
  button, input[type=text] { font: inherit; color: inherit; background: none; border: 0; border-radius: 6px; }
  button { cursor: pointer; transition: background 120ms, color 120ms, border-color 120ms; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  /* A list that may scroll fades out at its bottom edge, so a cut row reads as "there is more". */
  .scroll {
    flex: 1; min-height: 0; overflow-y: auto; margin-right: -10px; padding: 0 10px 28px 0;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
  }
  /* Blocks of one column that follow each other are set apart by a hairline, so a title needs no other mark. */
  .rule { border-top: 1px solid var(--line); padding-top: 16px; }

  /* Left: what to try. */
  input[type=text] {
    width: 100%; padding: 6px 0; border-bottom: 1px solid var(--line); border-radius: 0;
    font-size: 16px; user-select: text;
  }
  input[type=text]:focus { outline: none; border-color: var(--text); }
  input::placeholder { color: var(--muted); }
  /* A choice among a few: words in a row, the current one underlined. The view tabs are the same thing. */
  .choice { display: flex; gap: 20px; align-items: baseline; }
  .choice button { padding: 4px 0; border-radius: 0; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .choice button:hover { color: var(--text); }
  .choice button[aria-pressed=true] { color: var(--text); border-color: var(--text); }
  /* Beside the choices, what acts on them: quieter, underlined like a link. */
  .choice button.action { font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
  #profiles { flex-wrap: wrap; gap: 0 18px; }
  #profiles input { width: 130px; padding: 4px 0; font-size: 14px; }
  .setting output span { cursor: pointer; }
  .setting output span:hover { color: var(--text); text-decoration: underline; }
  /* The sliders come in groups that open and close. The view on screen opens the groups that move what it
     shows; a group opened or closed by hand stays so until the view changes. Its title row says how many of
     its values left the pack's, so a closed group hides no change. The title stays in sight while its own
     sliders scroll under it. */
  .group > h2 { position: sticky; top: 0; z-index: 1; margin: 0; background: var(--ground); border-top: 1px solid var(--line); }
  .group:last-of-type { border-bottom: 1px solid var(--line); }
  .group > h2 button {
    width: 100%; display: flex; align-items: baseline; gap: 10px; padding: 13px 0 6px;
    font-weight: 600; text-align: left; border-radius: 0;
  }
  /* What scrolls under a title that stays fades into it, rather than being cut across a line. The fade
     lies over the body's own top margin, so it touches nothing while the list is not scrolled. */
  .group > h2::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 8px; pointer-events: none; background: linear-gradient(var(--ground), transparent); }
  .group .note { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--muted); }
  /* Points down while there is something to open, up once it is open. */
  .group .chevron {
    flex: none; width: 7px; height: 7px; margin: 0 3px 0 2px; align-self: center; color: var(--muted);
    border-right: 1.5px solid; border-bottom: 1.5px solid; transform: translateY(-2px) rotate(45deg); transition: transform 120ms;
  }
  .group > h2 button[aria-expanded=false] { padding-bottom: 12px; }
  .group > h2 button:hover .chevron { color: var(--text); }
  .group > h2 button[aria-expanded=true] .chevron { transform: translateY(2px) rotate(-135deg); }
  .group .body { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 20px; }
  #settings > small { display: block; padding-top: 12px; }
  .setting { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: baseline; }
  .setting label { font-size: 13px; }
  .setting output { font-weight: 600; }
  .setting output span { margin-right: 8px; font-weight: 400; color: var(--muted); }
  /* A slider is a hairline and a small mark to move. A notch stays where the pack's value is.
     A changed value keeps the pack's value beside it: that, and the notch, say how far it went. */
  .setting input {
    grid-column: 1 / -1; width: 100%; height: 22px; margin: 0; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background:
      linear-gradient(var(--muted), var(--muted)) calc(8px + (100% - 16px) * var(--pack)) 50% / 1px 7px no-repeat,
      linear-gradient(var(--track), var(--track)) 0 50% / 100% 1px no-repeat;
  }
  .setting input::-webkit-slider-runnable-track { height: 22px; background: none; }
  /* Wider than what it shows, so it stays easy to catch. */
  .setting input::-webkit-slider-thumb {
    -webkit-appearance: none; width: 17px; height: 22px; border: 0; border-radius: 0;
    background: linear-gradient(var(--text), var(--text)) center / 2px 14px no-repeat;
  }
  .setting small { grid-column: 1 / -1; }
  /* The ores under the ground: rows of numbers that show on the cut at once, unlike the sliders. */
  .group .at-once { font-size: 13px; }
  #addedActions { flex-wrap: wrap; gap: 0 16px; }
  .ore-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) 6ch 5ch 5ch 14px; gap: 10px; align-items: baseline; padding: 2px 0; font-size: 13px; }
  .ore-row i { width: 12px; height: 12px; border-radius: 2px; align-self: center; box-shadow: inset 0 0 0 1px rgb(128 128 128 / 0.35); }
  .ore-row.head { font-size: 12px; color: var(--muted); }
  .ore-row.head span { text-align: right; }
  .ore-row input {
    width: 100%; padding: 2px 0; font: inherit; color: inherit; text-align: right; background: none;
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0; user-select: text; -moz-appearance: textfield;
  }
  .ore-row input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .ore-row input:focus { outline: none; border-color: var(--text); }
  .ore-row button { padding: 0; color: var(--muted); }
  .ore-row button:hover { color: var(--text); }
  /* What the button says, on two lines at most whatever it says, so a message never moves the sliders. */
  #status {
    flex: none; height: 36px; font-size: 13px; line-height: 18px; color: var(--muted); overflow: hidden; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  }
  #status.trouble { color: var(--warn); }
  #run { flex: none; display: flex; flex-direction: column; gap: 8px; }
  /* The button always says what it does. When there is nothing to compute it turns to grey
     stone, and the line above it says why. Its texture is drawn by the script, 16 texels high. */
  #generate {
    flex: none; height: 48px; padding: 9px 0 0; border-radius: 0; font-weight: 600; color: #fff;
    background-size: auto 100%; image-rendering: pixelated;
    text-shadow: 2px 2px 0 rgb(0 0 0 / 0.6); box-shadow: inset 0 -3px 0 rgb(0 0 0 / 0.3);
  }
  #generate:hover:not(:disabled) { filter: brightness(1.12); }
  #generate:active:not(:disabled) { filter: brightness(0.9); }
  #generate:disabled { filter: grayscale(1) brightness(0.5); }
  /* While a run is under way the same button stops it: stone, but lit. */
  #generate.stop:not(:disabled) { filter: grayscale(1) brightness(0.85); }

  /* Middle: the map. Tabs, map and the lines under it hang off one square, so they stay one block. Room is
     kept under the square for two lines: what is under the pointer, and the steps of the last run. */
  #stage { --under: 76px; flex: 1; min-height: 0; display: grid; place-items: start center; container-type: size; }
  #frame { position: relative; margin-top: 40px; width: min(100cqw, 100cqh - 40px - var(--under)); aspect-ratio: 1; }
  #flat, #map, #relief, #grid { position: absolute; inset: 0; width: 100%; height: 100%; }
  #relief canvas { display: block; width: 100%; height: 100%; }
  /* The flat map may be looked at closer: --k is how many times, --x and --y where its corner went, in widths of the square. */
  #flat { overflow: hidden; container-type: size; --k: 1; --x: 0; --y: 0; }
  #map {
    image-rendering: pixelated; cursor: crosshair; transition: opacity 200ms; touch-action: none;
    transform-origin: 0 0; transform: translate(calc(var(--x) * 100%), calc(var(--y) * 100%)) scale(var(--k));
  }
  /* The marks of the structures are drawn finer than the map's points: they are smoothed, not blown up. */
  #map.marks { image-rendering: auto; }
  #frame.busy #map, #frame.busy #relief, #frame.busy #grid, #frame.busy #cut { opacity: 0.3; }
  /* One square of the grid is 1024 blocks. */
  #grid {
    pointer-events: none;
    background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    /* The lines follow the map and keep their one pixel, which a scaled sheet would thicken. */
    background-size: calc(12.5% * var(--k)) calc(12.5% * var(--k));
    background-position: calc(var(--x) * 100cqw) calc(var(--y) * 100cqh);
  }
  #grid::after {
    content: ""; position: absolute; left: calc((var(--x) + 0.5 * var(--k)) * 100%); top: calc((var(--y) + 0.5 * var(--k)) * 100%); width: 15px; height: 15px; transform: translate(-50%, -50%);
    background: linear-gradient(#fff, #fff) center / 15px 1px no-repeat, linear-gradient(#fff, #fff) center / 1px 15px no-repeat;
    filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000);
  }
  /* Where the section's cut runs: a tick on each edge of the map, outside it, so the map stays whole. */
  #cutLine { position: absolute; left: -9px; right: -9px; height: 0; pointer-events: none; }
  #cutLine::before, #cutLine::after { content: ""; position: absolute; top: -0.5px; width: 6px; height: 1px; background: var(--muted); }
  #cutLine::before { left: 0; }
  #cutLine::after { right: 0; }
  #note { position: absolute; inset: 0; display: grid; place-items: center; padding: 40px; text-align: center; color: var(--muted); pointer-events: none; }
  /* While the sketch of a run is on the map, the figures and the list still describe the map before: they step back. */
  #numbers.stale { opacity: 0.3; transition: opacity 200ms; }
  #tabs { position: absolute; left: 0; right: 0; bottom: calc(100% + 12px); }
  /* The section is not a map: it stands a little apart from the views of the map. */
  #tabs [data-view=section] { position: relative; margin-left: 16px; }
  #tabs [data-view=section]::before { content: ""; position: absolute; left: -19px; top: 9px; height: 13px; border-left: 1px solid var(--line); }
  #tabs .apart { margin-left: auto; }
  /* The tabs hold on one line over the narrowest map: one step smaller there, and a little closer. */
  @media (max-width: 1100px) {
    #tabs { gap: 12px; font-size: 13px; }
    #tabs [data-view=section] { margin-left: 10px; }
    #tabs [data-view=section]::before { left: -12px; top: 8px; }
  }
  #under { position: absolute; left: 0; right: 0; top: calc(100% + 12px); display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  #under .choice { gap: 18px; }
  #probe { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The steps of a run, under what it draws: done with the second it ended at, the one under way, and a
     hairline that fills as the wait goes. They stay after the run, to see where the time went. Down here they
     cost the sliders nothing, and the eye is on the map anyway while its sketches land. */
  #steps { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 12px; color: var(--muted); }
  #steps .bar { flex: 0 0 100%; height: 1px; margin-bottom: 4px; background: linear-gradient(var(--text), var(--text)) 0 0 / calc(var(--share) * 100%) 100% no-repeat, var(--line); }
  .step { white-space: nowrap; }
  .step b { display: inline-block; width: 12px; font-weight: 400; }
  .step.now { color: var(--text); }
  /* The section takes the square's place: the whole cut drawn small, then the part looked at, at true scale. */
  #frame.cut { width: 100cqw; height: calc(100cqh - 40px - var(--under)); aspect-ratio: auto; }
  #cut { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; }
  #nav { flex: none; position: relative; height: 56px; cursor: pointer; touch-action: none; border-bottom: 1px solid var(--line); }
  #navCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* The part looked at: a frame in the colour of the text, nothing filled. */
  #navFrame { position: absolute; top: 0; bottom: 0; min-width: 5px; outline: 1px solid var(--text); outline-offset: -1px; cursor: grab; }
  #navNote { flex: none; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  #cutView { flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: crosshair; touch-action: none; border-bottom: 1px solid var(--line); }
  #cutCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Right: the numbers, then the list of what the view shows. */
  #numbers { gap: 0; }
  #numbers > .rule { margin-top: 22px; }
  #numbers.cut > .rule { margin-top: 0; padding-top: 0; border-top: 0; }
  #listBlock { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .figures { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 5px 14px; align-items: baseline; }
  .figures > span[class=""] { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .figures .head { font-size: 12px; color: var(--muted); text-align: right; }
  .figures .value { font-weight: 600; text-align: right; }
  .figures .goal { font-size: 18px; }
  .figures .before { color: var(--muted); text-align: right; }
  /* On the figures of the goal, what moved is the answer: it reads as strongly as the value. */
  .figures .goal-change { color: var(--text); font-weight: 600; }
  .figures .rule { grid-column: 1 / -1; height: 1px; margin: 6px 0; padding: 0; border: 0; background: var(--line); }
  .biome {
    width: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 8px; align-items: center;
    padding: 4px 0; text-align: left; font-size: 13px;
  }
  .biome:hover .name { text-decoration: underline; }
  /* The list mirrors the map: the chosen biomes stay lit, the others step back. */
  .biome[aria-pressed=true] .name { font-weight: 600; }
  #biomes.choosing .biome[aria-pressed=false] { opacity: 0.6; }
  #biomes.choosing .biome[aria-pressed=false]:hover { opacity: 0.9; }
  #filter { padding: 4px 0; margin-bottom: 6px; font-size: 13px; border-color: var(--track); }
  /* Two lines whatever it says, so the first choice does not move the rows under the pointer. */
  #pick { display: block; height: 36px; overflow: hidden; }
  #pick button { padding: 0; font-size: 12px; color: var(--text); }
  #pick button:hover { text-decoration: line-through; }
  #pick button.none { margin-left: 8px; text-decoration: underline; }
  /* A thin edge, so a white or pale swatch does not vanish on the light ground. */
  .biome i { width: 12px; height: 12px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgb(128 128 128 / 0.35); }
  /* A structure is a mark on the map, so its swatch is one too. */
  .biome i.mark { width: 10px; height: 10px; margin: 1px; border-radius: 50%; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.55); }
  .biome .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .biome .width { color: var(--muted); min-width: 8ch; text-align: right; }
  .biome .share { min-width: 6ch; text-align: right; }
  .legend { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 8px; font-size: 12px; color: var(--muted); }
  .legend .width { min-width: 8ch; text-align: right; }
  .legend .share { min-width: 6ch; text-align: right; }
  @media (max-width: 1100px) {
    /* The figures keep each name on one line: a step smaller, the goal's figures down to the titles' size. */
    .figures { gap: 5px 10px; font-size: 13px; }
    .figures .goal { font-size: 16px; }
    .biome .width, .legend .width { min-width: 7ch; }
    .biome .share, .legend .share { min-width: 5ch; }
  }
</style>
</head>
<body>
  <section class="column">
    <div>
      <h2 data-text="seed"></h2>
      <input type="text" id="seed" maxlength="64" spellcheck="false">
    </div>
    <div class="setting">
      <h2 data-text="span"></h2><output class="num" id="areaValue" for="area"></output>
      <input type="range" id="area" min="256" max="2048" step="256">
      <small id="areaHint"></small>
    </div>
    <div>
      <h2 data-text="profiles"></h2>
      <div id="profiles" class="choice"></div>
    </div>
    <div id="settings" class="scroll"></div>
    <div id="run">
      <div id="status" role="status"></div>
      <button id="generate" data-text="generate"></button>
    </div>
  </section>

  <section class="column">
    <div id="stage">
      <div id="frame">
        <div id="tabs" class="choice"></div>
        <div id="flat">
          <canvas id="map"></canvas>
          <div id="grid" hidden></div>
        </div>
        <div id="cutLine" hidden></div>
        <div id="relief" hidden></div>
        <div id="cut" hidden>
          <div id="nav"><canvas id="navCanvas"></canvas><div id="navFrame"></div></div>
          <div id="navNote" class="num"></div>
          <div id="cutView"><canvas id="cutCanvas"></canvas></div>
        </div>
        <div id="note"></div>
        <div id="under">
          <div class="choice">
            <div id="probe" class="num muted"></div>
            <button id="nextCut" class="action" data-text="nextCut" hidden></button>
            <button id="export" class="action" data-text="export"></button>
          </div>
          <div id="steps" class="num"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="column" id="numbers">
    <div id="figuresBlock">
      <h2 data-text="figures"></h2>
      <div class="figures num" id="figures"></div>
    </div>
    <div id="listBlock" class="rule">
      <div>
        <h2 id="listTitle"></h2>
        <input type="text" id="filter" spellcheck="false">
        <small id="pick"></small>
      </div>
      <div class="legend" id="listHead"><span></span><span id="listColumn"></span><span class="width" data-text="colWidth"></span><span class="share" data-text="colShare"></span></div>
      <div id="biomes" class="scroll"></div>
    </div>
  </section>

<script type="module">
  // Every sentence the page shows, in one place.
  const text = {
    seed: 'Seed',
    seedRandom: 'random',
    span: 'Scanned area',
    spanValue: v => `${v} blocks`,
    spanHint: wait => `Takes about ${wait}.`,
    duration: s => s < 60 ? `${s} s` : `${Math.floor(s / 60)} min${s % 60 ? ` ${s % 60} s` : ''}`,
    generate: 'Generate preview',
    upToDate: 'The map shows these settings.',
    stop: 'Stop',
    running: (elapsed, about) => `${elapsed} of about ${about}.`,
    steps: {
      start: 'Starting the game',
      sketch: step => `Sketch, every ${step} blocks`,
      full: 'Full map and figures',
      readable: 'The sketch on the map can be read already.',
    },
    stopped: 'Stopped. The map is the one from before.',
    export: 'Export',
    exportHint: 'Keeps the settings, the figures, and a picture of each view, flat and in 3D as it is looked at now, in a folder.',
    exporting: 'Exporting…',
    exportStep: view => `Pictures: ${view}`,
    exportData: 'Settings and figures',
    exported: folder => `Exported to ${folder}`,
    exportFailed: 'The export failed.',
    figures: 'In figures',
    change: 'change',
    was: v => `before: ${v}`,
    same: '=',
    close: '≈',
    points: ' pt',
    // What the list beside the map holds in each view: [its title, the name of its first column].
    lists: { biomes: ['Biomes', 'biome'], flat: ['Ground', 'ground'], height: ['Heights', 'height'], temperature: ['Temperatures', 'climate'], structures: ['Structures', 'structure'] },
    heightBands: (sea, steps) => ['Under the sea', ...steps.map((top, i) => `${i ? steps[i - 1] : sea} to ${top}`), `Above ${steps.at(-1)}`],
    pickHint: 'Click rows, here or on the map.',
    pickedMany: count => `${count} chosen`,
    pickedShare: share => ` · ${share} of the area`,
    pickedCount: (count, of) => ` · ${count} of ${of}`,
    pickRemove: name => `Remove ${name}`,
    pickNone: 'Show all',
    filter: 'Filter by name…',
    colWidth: 'typical width',
    colShare: 'share',
    colSpacing: 'one every',
    colSpacingHint: 'About how far apart two of them are: the side of the square each has to itself on this area.',
    colCount: 'count',
    groups: { biomes: 'Biome size and climate', relief: 'Relief', continents: 'Continents and oceans', ores: 'Ores under the ground' },
    changed: count => `${count} changed`,
    changedHint: 'Values that differ from the pack’s',
    // Each hint says what changes in the world, in the direction that grows it.
    settings: {
      temperature_scale:      ['Temperature scale', 'Lower: wider warm and cold zones.'],
      vegetation_scale:       ['Vegetation scale', 'Lower: wider dry and wet zones.'],
      temperature_multiplier: ['Temperature range', 'Lower: fewer deserts and ice lands.'],
      vegetation_multiplier:  ['Vegetation range', 'Lower: fewer very dry and very wet lands.'],
      temperature_offset:     ['Temperature offset', 'Higher: a warmer world.'],
      vegetation_offset:      ['Vegetation offset', 'Higher: a wetter world.'],
      vertical_scale:         ['Vertical scale', 'Higher: taller and steeper relief.'],
      flat_terrain_skew:      ['Flat against plateaus', 'Higher: more flat land, fewer plateaus.'],
      erosion_scale:          ['Erosion scale', 'Lower: wider massifs, vaster plains.'],
      ridge_scale:            ['Ridge scale', 'Lower: wider rivers, broader valleys.'],
      continents_scale:       ['Continent scale', 'Lower: larger continents and oceans.'],
      ocean_offset:           ['Land against ocean', 'Higher: more land, less ocean.'],
    },
    packValue: v => `pack ${v}`,
    resetOne: 'Back to the pack’s value',
    resetHint: 'Click “pack…” beside a value to put it back to the pack’s.',
    profiles: 'Settings',
    profilePack: 'Pack',
    profilePackHint: 'Put everything back to the pack’s values',
    profileSave: 'Save',
    profileDelete: 'Delete',
    profileName: 'Name',
    profileDefault: n => `Try ${n}`,
    views: { biomes: 'Biomes', flat: 'Flat', height: 'Relief', temperature: 'Temperature', structures: 'Structures' },
    shapes: { flat2d: '2D', relief3d: '3D' },
    done: wait => `Preview ready in ${wait}.`,
    failed: 'The run failed. Try again, then see last-run.log in the preview folder.',
    refused: 'Seed refused: it takes letters, digits, spaces and hyphens.',
    noPreview: 'No preview yet. Choose a seed and generate one.',
    no3d: 'The 3D view could not load (it needs the internet the first time).',
    serverGone: 'The preview server has stopped. Close this window and open it again.',
    probe: (x, z, y, biome) => `x ${x}   z ${z}   height ${y}   ${biome}`,
    area: (blocks, square, cut) => `${blocks} × ${blocks} blocks, north up. One square: ${square} blocks. Cross: 0,0.${cut ? ' Ticks: the cut.' : ''}`,
    // The structures: where each would start, as the generator places them.
    noStructures: 'No structures for this preview. Generate it again.',
    structureProbe: (x, z, name) => `x ${x}   z ${z}   ${name}`,
    // [name, a short note beside it, the definition shown on hover]
    figureNames: {
      flat:    ['Flat land', '', 'Share of the land. Flat: the ground moves by 2 blocks at most to the neighbour points, 16 blocks away. A lone flat point does not count.'],
      expanse: ['Typical flat zone', '', 'Width of the flat zone a flat point taken at random falls in. A river does not cut a zone.'],
      typical: ['Typical biome', '', 'Width of the biome zone a point taken at random on land falls in.'],
      ocean:   ['Sea', '', 'Share of the whole area below sea level, rivers and lakes included.'],
      high:    ['High land', '', 'Share of the land higher than 150.'],
      top:     ['Highest peak', '', ''],
      count:   ['Biomes present', '', ''],
    },
    goalFigures: ['flat', 'expanse', 'typical'],
    altitude: v => `height ${v}`,
    // The section: a cut through the ground, and the ores played on it.
    section: 'Section',
    noSection: 'No section for this preview. Generate it again.',
    nextCut: 'Another cut',
    nextCutHint: 'The cuts are the lines of this map that cross the most different ground: a height, some sea, some level land.',
    cutRest: (at, of, z, from, to) => `Cut ${at} of ${of}, west to east at z ${z}, x ${from} to ${to}. True scale. Wheel: closer.`,
    navNote: times => `The whole cut, heights × ${times}. Click or drag the frame to look along it.`,
    cutProbe: (x, y, depth, what, biome) => `x ${x}   height ${y}   ${depth}   ${what}   ${biome}`,
    cutDepth: depth => depth > 0 ? `${depth} under the ground` : 'above the ground',
    cutCells: ['Air', 'Rock', 'Water', 'Lava'],
    cutEarth: 'Top layers',
    ores: { coal: 'Coal', copper: 'Copper', iron: 'Iron', gold: 'Gold', lapis: 'Lapis', redstone: 'Redstone', diamond: 'Diamond', emerald: 'Emerald' },
    oreList: ['Ores', 'ore'],
    oreColumns: ['low ground', 'high ground'],
    oreColumnsHint: plays => `Blocks of ore per chunk within 64 blocks under the ground: where the ground is under height 80, and from 80 up. Counted over ${plays} chunks played along this cut.`,
    orePickHint: 'Click an ore to see it alone.',
    oreFrom: rules => `From: ${rules}`,
    oreUnplayed: count => `${count} ore rules use a placement step this page cannot play: they are left out.`,
    addedAtOnce: 'These show on the cut at once, without Generate.',
    addedNone: 'No ore counted from the ground yet: add one.',
    addedHint: 'Ores placed at a depth counted from the ground, on top of the others. Kept in this window, never written to the pack. The ground is the generator’s; the ores are a play of the server’s rules on it, not the blocks a world would hold.',
    addedHead: ['', '', 'tries', 'from', 'to', ''],
    addedCountHint: 'Tries per chunk',
    addedDepthHint: 'Blocks under the ground, from the nearest to the deepest.',
    addedAdd: name => `+ ${name}`,
    addedRemove: 'Remove',
    addedWithout: 'Without them',
    addedWithoutHint: 'Shows the cut without the ores of this list, to compare.',
    addedReset: 'Back to the mods’ values',
    legend: {
      flat: ['Flat', 'Slopes', 'Water'],
      temperature: ['Frozen', 'Cold', 'Temperate', 'Warm', 'Scorching'],
      water: 'Water',
    },
  };
  const num = (v, digits = 0) => v.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  const percent = v => `${num(v, 1)}%`;
  // A width read on a 16-block grid is not known to the block: round it to 50.
  const blocks = v => `${num(Math.round(v / 50) * 50)} blocks`;

  // What each slider may explore. The starting values come from the pack.
  const ranges = {
    biomes:     { temperature_scale: [0.03, 0.5, 0.01], vegetation_scale: [0.03, 0.5, 0.01],
                  temperature_multiplier: [0.5, 1.5, 0.05], vegetation_multiplier: [0.5, 1.5, 0.05],
                  temperature_offset: [-0.5, 0.5, 0.05], vegetation_offset: [-0.5, 0.5, 0.05] },
    relief:     { vertical_scale: [0.5, 2, 0.025], flat_terrain_skew: [-0.5, 0.5, 0.05],
                  erosion_scale: [0.05, 0.5, 0.01], ridge_scale: [0.05, 0.5, 0.01] },
    continents: { continents_scale: [0.03, 0.3, 0.01], ocean_offset: [-1, -0.2, 0.05] },
  };

  const $ = id => document.getElementById(id);

  // The browser keeps this window's size from one opening to the next, but a window that joins a browser
  // already running ignores the size its command line asks for. So the page sets it itself, the first
  // time only: after that, the size is whatever the person left.
  try {
    if (!localStorage.getItem('preview.sized')) { resizeTo(1400, 940); localStorage.setItem('preview.sized', '1'); }
  } catch { }

  // The page is a window of its own, not a document: its text keeps one size. Ctrl with the wheel, a pinch
  // (which arrives as the same thing) and Ctrl with plus or minus no longer zoom it. Ctrl+0 is left alone,
  // to undo a zoom the browser kept from before.
  addEventListener('wheel', event => { if (event.ctrlKey) event.preventDefault(); }, { passive: false });
  addEventListener('keydown', event => { if ((event.ctrlKey || event.metaKey) && '+-=_'.includes(event.key)) event.preventDefault(); });

  for (const el of document.querySelectorAll('[data-text]')) el.textContent = text[el.dataset.text];
  $('seed').placeholder = text.seedRandom;
  $('filter').placeholder = text.filter;
  const scheme = matchMedia('(prefers-color-scheme: dark)');

  // The button is a block of grass seen from its side, drawn here texel by texel: 16 rows, a few
  // of grass with a ragged lower edge, then earth with a pebble now and then. Our own colours and
  // our own noise: no file of the game is used.
  function blockTexture(columns) {
    // A number from 0 to 1 per texel, with no pattern from one texel to its neighbours.
    const noise = (x, y) => {
      let h = Math.imul((x * 374761393 + y * 668265263) ^ 0x9e3779b9, 1274126177);
      h = Math.imul(h ^ (h >>> 15), 2246822519);
      return ((h ^ (h >>> 13)) >>> 0) / 4294967296;
    };
    const tile = document.createElement('canvas');
    tile.width = columns; tile.height = 16;
    const brush = tile.getContext('2d');
    const grass = ['#7fb850', '#6da544', '#5d9239', '#86c257'];
    const earth = ['#8b6344', '#7a573b', '#96704e', '#6b4b33', '#82603f'];
    for (let x = 0; x < columns; x++) {
      const depth = 3 + Math.floor(noise(x, 99) * 3);
      for (let y = 0; y < 16; y++) {
        const pick = noise(x, y);
        brush.fillStyle = y < depth ? grass[Math.floor(pick * grass.length)]
          : y > depth + 1 && pick > 0.95 ? '#8f8a84' : earth[Math.floor(pick * earth.length)];
        brush.fillRect(x, y, 1, 1);
      }
    }
    return tile.toDataURL();
  }
  $('generate').style.backgroundImage = `url(${blockTexture(96)})`;

  // ---------- the settings column ----------

  const packValues = await fetch('/api/preview/config').then(r => r.json());
  const inputs = {};
  let shown = null;       // the seed, span and values the map on screen was made with
  let busy = false;
  let trouble = '';       // what went wrong; it stays until the next attempt
  let said = '';          // how the last run ended, when it did not go wrong
  let exporting = false;  // pictures are being taken: the map is drawn whole, whatever is chosen
  // Grid points per side, one every 16 blocks whatever the width, so the measures keep their meaning.
  let samples = 512;
  // Seconds a run takes, about: the server starts, then every point costs the same (measured on
  // 512, 1024 and 2048 points a side). Four times the area is four times the wait. The cost of a
  // point is that of the machine: the first guess is the one it was written on (half of 16 threads),
  // then each finished run gives this machine's own.
  const startSeconds = 11;
  let pointSeconds = 80e-6;
  try { pointSeconds = +localStorage.getItem('preview.pointSeconds') || pointSeconds; } catch { }
  const about = points => Math.round((startSeconds + points * points * pointSeconds) / 5) * 5;
  function learnPace(points, seconds) {
    if (seconds <= startSeconds) return;
    pointSeconds = (seconds - startSeconds) / (points * points);
    try { localStorage.setItem('preview.pointSeconds', pointSeconds); } catch { }
  }

  // The button keeps its name. It is greyed when there is nothing new to compute, and the line
  // above it says why: the map already shows these settings, or a run is under way.
  function showButton() {
    if (busy) return;
    const same = !!shown && shown.seed === $('seed').value.trim() && shown.samples === samples
      && Object.entries(inputs).every(([key, input]) => Math.abs(input.value - shown.values[key]) < 1e-9);
    $('generate').disabled = same;
    $('status').className = trouble ? 'trouble' : '';
    $('status').textContent = trouble || said || (same ? text.upToDate : '');
  }
  const say = sentence => { trouble = sentence; showButton(); };

  // The width is a slider like the others, from 4096 to 32768 blocks. Its value says the wait it costs.
  const area = $('area');
  area.style.setProperty('--pack', (512 - area.min) / (area.max - area.min));
  function showSpan() {
    area.value = samples;
    $('areaValue').textContent = text.spanValue(num(samples * 16));
    $('areaHint').textContent = text.spanHint(text.duration(about(samples)));
    showButton();
  }
  area.addEventListener('input', () => { samples = +area.value; showSpan(); });
  area.addEventListener('dblclick', () => { samples = 512; showSpan(); });

  // Sets of slider values kept under a name by the browser, to come back to a try in one click.
  // "Pack" is always there: it puts every slider back.
  let profiles = [];
  try { profiles = JSON.parse(localStorage.getItem('preview.profiles')) || []; } catch { }
  let naming = false;
  const matches = values => Object.entries(inputs).every(([key, input]) => Math.abs(input.value - (values[key] ?? packValues[key])) < 1e-9);
  function apply(values) {
    for (const [key, input] of Object.entries(inputs)) { input.value = values[key] ?? packValues[key]; input.dispatchEvent(new Event('input')); }
  }
  function showProfiles() {
    const button = (label, act, pressed) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (pressed == null) b.className = 'action'; else b.setAttribute('aria-pressed', pressed);
      b.addEventListener('click', act);
      return b;
    };
    const active = profiles.find(p => matches(p.values));
    const pack = button(text.profilePack, () => apply(packValues), matches(packValues));
    pack.title = text.profilePackHint;
    const items = [pack, ...profiles.map(p => button(p.name, () => apply(p.values), p === active))];
    const save = () => { try { localStorage.setItem('preview.profiles', JSON.stringify(profiles)); } catch { } };
    if (naming) {
      const name = document.createElement('input');
      name.type = 'text'; name.maxLength = 24; name.placeholder = text.profileName;
      name.value = text.profileDefault(profiles.length + 1);
      const end = keep => {
        if (!naming) return;
        naming = false;
        const values = Object.fromEntries(Object.entries(inputs).map(([key, input]) => [key, +input.value]));
        if (keep && name.value.trim()) { profiles = [...profiles.filter(p => p.name !== name.value.trim()), { name: name.value.trim(), values }]; save(); }
        showProfiles();
      };
      name.addEventListener('keydown', event => { if (event.key === 'Enter') end(true); if (event.key === 'Escape') end(false); });
      name.addEventListener('blur', () => end(true));
      items.push(name);
      queueMicrotask(() => { name.focus(); name.select(); });
    } else if (active) {
      items.push(button(text.profileDelete, () => { profiles = profiles.filter(p => p !== active); save(); showProfiles(); }));
    } else if (!matches(packValues)) {
      items.push(button(text.profileSave, () => { naming = true; showProfiles(); }));
    }
    $('profiles').replaceChildren(...items);
  }

  // The groups open and close. Looking at a view opens the groups whose values move what it shows and
  // closes the others; what is opened or closed by hand holds until the view changes. No group is ever
  // left out of the list, and its title row counts its changed values, so nothing changed is out of sight.
  const opensFor = { biomes: ['biomes', 'continents'], flat: ['relief'], height: ['relief', 'continents'],
                     temperature: ['biomes'], structures: ['biomes'], section: ['ores', 'relief'] };
  const groups = {};
  function makeGroup(key) {
    const box = document.createElement('section');
    box.className = 'group';
    box.innerHTML = '<h2><button aria-expanded="false"><span></span><span class="note num"></span><span class="chevron"></span></button></h2><div class="body"></div>';
    const button = box.querySelector('button'), body = box.querySelector('.body');
    button.children[0].textContent = text.groups[key];
    body.id = `group-${key}`;
    button.setAttribute('aria-controls', body.id);
    button.addEventListener('click', () => openGroup(key, button.getAttribute('aria-expanded') !== 'true'));
    groups[key] = { box, button, body, note: button.children[1] };
    $('settings').append(box);
    return body;
  }
  function openGroup(key, open) {
    groups[key].button.setAttribute('aria-expanded', open);
    groups[key].body.hidden = !open;
  }
  // The first group a view names is the one it is most about: the list scrolls as little as it takes to
  // show it whole, or from its title when it is taller than the list.
  function openGroupsFor(shown) {
    for (const key in groups) openGroup(key, opensFor[shown].includes(key));
    const list = $('settings'), first = groups[opensFor[shown][0]].box, top = first.offsetTop - list.offsetTop;
    // The list's own room, less the fade at its foot.
    const room = list.clientHeight - 28;
    list.scrollTop = first.hidden ? 0 : first.offsetHeight > room ? top : Math.max(0, top + first.offsetHeight - room);
  }
  function showNote(key, count) {
    groups[key].note.textContent = count ? text.changed(count) : '';
    groups[key].note.title = count ? text.changedHint : '';
  }
  const changedIn = group => Object.keys(ranges[group]).filter(key => inputs[key] && Math.abs(inputs[key].value - packValues[key]) > 1e-9).length;

  for (const [group, keys] of Object.entries(ranges)) {
    const body = makeGroup(group);
    for (const [key, [min, max, step]] of Object.entries(keys)) {
      const [label, hint] = text.settings[key];
      const digits = step < 0.01 ? 3 : 2;
      const row = document.createElement('div');
      row.className = 'setting';
      row.innerHTML = `<label for="${key}"></label><output class="num" for="${key}"></output>
        <input type="range" id="${key}" min="${min}" max="${max}" step="${step}"><small></small>`;
      row.querySelector('label').textContent = label;
      row.querySelector('small').textContent = hint;
      const input = row.querySelector('input');
      const output = row.querySelector('output');
      input.value = packValues[key];
      input.style.setProperty('--pack', (packValues[key] - min) / (max - min));
      const show = () => {
        const changed = Math.abs(input.value - packValues[key]) > 1e-9;
        // A changed value keeps the pack's value beside it, to know how far it went.
        output.replaceChildren(num(+input.value, digits));
        if (changed) {
          const pack = document.createElement('span');
          pack.textContent = text.packValue(num(packValues[key], digits));
          pack.title = text.resetOne;
          pack.addEventListener('click', () => { input.value = packValues[key]; show(); });
          output.prepend(pack);
        }
        showNote(group, changedIn(group));
        showButton();
        if (!naming) showProfiles();
      };
      input.addEventListener('input', show);
      input.addEventListener('dblclick', () => { input.value = packValues[key]; show(); });
      inputs[key] = input;
      body.append(row);
      show();
    }
  }
  // The ores under the ground: rows that the section plays at once. The group is there when the preview has a section.
  {
    const body = makeGroup('ores');
    body.innerHTML = '<div class="at-once"></div><div id="addedActions" class="choice"></div><div id="oreRows" class="num"></div><small></small>';
    body.children[0].textContent = text.addedAtOnce;
    body.children[3].textContent = text.addedHint;
    groups.ores.box.hidden = true;
  }
  const resetHint = document.createElement('small');
  resetHint.textContent = text.resetHint;
  $('settings').append(resetHint);
  // No seed is a seed drawn at random; the one that was drawn is written back once the map is there.
  $('seed').addEventListener('input', showButton);
  showSpan();

  // ---------- colours ----------

  // A biome's colour comes from its name: families share a hue, and each member gets its own shade.
  // The first rule that matches wins, so the narrow names come before the wide ones.
  // [hue, saturation, lightness].
  const families = [
    [/frozen_ocean|frozen_river/, [200, 50, 70]],
    [/deep.*ocean/, [222, 55, 30]],
    [/warm_ocean|lukewarm/, [190, 60, 45]],
    [/cold_ocean/, [215, 35, 45]],
    [/ocean|river/, [212, 55, 42]],
    [/snowy_taiga|snowy.*(spruce|pine)/, [175, 18, 74]],
    [/ice|frozen|glacial|snowy|wintry|siberian|frostfire/, [200, 25, 88]],
    [/alpine|grove|shield|taiga|spruce|pine/, [158, 32, 34]],
    [/oasis/, [150, 50, 62]],
    [/beach|shore/, [48, 45, 80]],
    [/badlands|mesa|canyon|bryce|painted|red_|scarlet/, [18, 62, 50]],
    [/desert|sands|dune/, [44, 62, 68]],
    [/arid|steppe/, [38, 40, 46]],
    [/savanna|shrubland|brushland|ashen/, [62, 38, 50]],
    [/jungle|tropical|rainforest|bamboo/, [112, 62, 34]],
    [/swamp|marsh|mangrove/, [150, 30, 28]],
    [/cherry|sakura|lavender|blooming|moonlight|amethyst|orchid|mushroom|warped/, [300, 40, 66]],
    [/volcanic|caldera|crater|basalt|yellowstone/, [8, 30, 38]],
    [/peaks|mountain|cliffs|spires|stony|rocky|windswept|granite|haze|emerald|yosemite|highlands/, [30, 8, 56]],
    [/forest|birch|woodland|cloud/, [128, 42, 36]],
    [/plains|meadow|valley|lowlands|field|clearing|lush/, [92, 45, 56]],
  ];
  function hashOf(string) {
    let h = 2166136261;
    for (let i = 0; i < string.length; i++) h = Math.imul(h ^ string.charCodeAt(i), 16777619);
    return (h >>> 0) / 4294967296;
  }
  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)))));
    return [f(0), f(8), f(4)];
  }
  function biomeColour(id) {
    const name = id.split(':')[1];
    const family = families.find(([pattern]) => pattern.test(name));
    // A name no rule knows: say so, the grey-green it gets tells nothing.
    if (!family) console.info('No colour family for', id);
    const [h, s, l] = family ? family[1] : [100, 20, 50];
    const vary = hashOf(id);
    return hslToRgb((h + (vary - 0.5) * 22 + 360) % 360, s, Math.max(12, Math.min(92, l + (hashOf(id + '!') - 0.5) * 16)));
  }
  // A structure's colour comes from its family, as a biome's does. The frequent families (mineshafts, buried
  // treasure, portals, wrecks, ocean ruins, villages) each get a hue far from the others', so they stay told
  // apart on the map; the members of a family share it in shades. The set is read with the id, so a mod's
  // village joins the villages; the namespace is not, or a mod named after dungeons would make all its
  // structures dungeons. [hue, saturation, lightness].
  const structureFamilies = [
    [/village|town|settlement|hamlet/, [96, 58, 50]],
    [/outpost|pillager|illager|bandit|camp|raid/, [0, 72, 56]],
    [/portal/, [282, 55, 66]],
    [/ocean_ruin|monument|underwater|coral/, [176, 62, 46]],
    [/shipwreck|ship|boat|typhon|pirate/, [26, 78, 52]],
    [/treasure|buried/, [52, 92, 56]],
    [/mineshaft|mine|ancient_city|stronghold|trial|dungeon|catacomb|crypt|underground/, [214, 72, 64]],
    [/pyramid|temple|hut|igloo|mansion|tower|castle|palace|keep|fort/, [328, 62, 66]],
    [/ruin|trail/, [40, 38, 64]],
  ];
  function structureColour(id, set) {
    const name = `${id.split(':').pop()} ${`${set ?? ''}`.split(':').pop()}`;
    const family = structureFamilies.find(([pattern]) => pattern.test(name));
    // A family no rule knows still gets a hue of its own, from its set, but a quieter one.
    const [h, s, l] = family ? family[1] : [hashOf(`${set ?? id}`) * 360, 34, 62];
    return hslToRgb((h + (hashOf(id) - 0.5) * 20 + 360) % 360, s, l + (hashOf(id + '!') - 0.5) * 14);
  }
  const isWater = id => /ocean|river/.test(id);
  // Height above the sea: lowland green, then ochre, rock, snow. Below: deeper is darker.
  function heightColour(y, sea) {
    if (y < sea) { const d = Math.min(1, (sea - y) / 60); return hslToRgb(212, 55, 46 - d * 26); }
    const stops = [[0, [110, 40, 42]], [40, [80, 40, 50]], [90, [40, 38, 48]], [150, [25, 20, 45]], [210, [0, 0, 70]], [260, [0, 0, 96]]];
    const up = y - sea;
    for (let i = 1; i < stops.length; i++) {
      if (up <= stops[i][0]) {
        const [a, ca] = stops[i - 1], [b, cb] = stops[i], t = (up - a) / (b - a);
        return hslToRgb(ca[0] + (cb[0] - ca[0]) * t, ca[1] + (cb[1] - ca[1]) * t, ca[2] + (cb[2] - ca[2]) * t);
      }
    }
    return [245, 245, 245];
  }
  // Biome base temperature, from -0.7 (frozen) to 2 (desert): blue, pale in the middle, red.
  // Two hues only, so a step in colour is a step in temperature.
  function temperatureColour(t) {
    const p = Math.max(0, Math.min(1, (t + 0.7) / 2.7));
    return p < 0.5 ? hslToRgb(214, 62, 42 + p * 2 * 46) : hslToRgb(10, 68, 88 - (p - 0.5) * 2 * 42);
  }
  const flatColours = { flat: hslToRgb(92, 48, 62), steep: hslToRgb(30, 8, 30), sea: hslToRgb(212, 45, 26) };
  const quietWater = hslToRgb(212, 22, 20);
  const css = c => `rgb(${c})`;

  // The name alone: which mod a biome or a structure comes from does not help to judge the world. The id stays on hover.
  const pretty = id => {
    const words = id.split(':').pop().replace(/[_/]+/g, ' ');
    return words[0].toUpperCase() + words.slice(1);
  };

  // ---------- the data and what we measure on it ----------

  let world = null;       // the current preview
  let view = 'biomes';
  let in3d = false;
  // What is shown alone in each view, by id: biomes, or bands of ground, height, temperature. A choice
  // lives through the next run, to follow a biome from one try to the other.
  const chosen = { biomes: new Set(), flat: new Set(), height: new Set(), temperature: new Set(), structures: new Set(), section: new Set() };
  // Where one band of height ends and the next starts, above the sea.
  const heightSteps = [100, 150, 200, 250];
  // The figures of the run before this one. Kept by the browser, so a reload does not lose them.
  let before = null;
  try { before = JSON.parse(localStorage.getItem('preview.before')); } catch { }

  async function loadWorld() {
    const meta = await fetch('/preview/data/preview.json').then(r => r.ok ? r.json() : null);
    if (!meta) return null;
    const [heights, biomes] = await Promise.all([
      fetch('/preview/data/heights.bin').then(r => r.arrayBuffer()).then(b => new Int16Array(b)),
      fetch('/preview/data/biomes.bin').then(r => r.arrayBuffer()).then(b => new Uint16Array(b)),
    ]);
    // Put the seed and the sliders back to what this preview was made with.
    const run = await fetch('/preview/data/run.json').then(r => r.ok ? r.json() : null).catch(() => null);
    samples = meta.samples;
    if (run) {
      $('seed').value = run.seed;
      shown = { seed: String(run.seed), samples, values: {} };
      for (const [key, input] of Object.entries(inputs)) {
        input.value = run.tectonic[key] ?? packValues[key];
        shown.values[key] = +input.value;
        input.dispatchEvent(new Event('input'));
      }
    }
    showSpan();
    const colours = meta.biomes.map(b => biomeColour(b.id));
    const [section, structures] = await Promise.all([loadSection(), loadStructures()]);
    return { ...meta, heights, biomeAt: biomes, colours, ...measure(meta, heights, biomes), section, structures };
  }

  // Where each structure would start, as the generator places them on this square: one row per place, the
  // kind as an index into the list of kinds. Older previews have no such file.
  async function loadStructures() {
    const data = await fetch('/preview/data/structures.json').then(r => r.ok ? r.json() : null).catch(() => null);
    if (!Array.isArray(data?.structures) || !Array.isArray(data.points)) return null;
    const kinds = data.structures.length, count = new Float64Array(kinds);
    const points = data.points.filter(([kind]) => kind >= 0 && kind < kinds);
    const byKind = Array.from({ length: kinds }, () => []);
    for (const point of points) { count[point[0]]++; byKind[point[0]].push(point); }
    return {
      ids: data.structures.map(s => s.id), points, count, byKind,
      colours: data.structures.map(s => structureColour(s.id, s.set)),
      // Drawn kind by kind, the most frequent first, so the rare ones lie over them.
      order: data.structures.map((_, i) => i).filter(i => count[i]).sort((a, b) => count[b] - count[a]),
    };
  }

  // The sketches a run writes first: the same square with fewer points, each finer than the one
  // before. Nothing is measured on them, since flat land is defined on the 16-block grid: they are
  // only drawn. Gives nothing unless the last one written is finer than `finerThan` blocks a point.
  async function loadSketch(finerThan = Infinity) {
    const meta = await fetch('/preview/data/coarse.json').then(r => r.ok ? r.json() : null);
    if (!meta || meta.step >= finerThan) return null;
    // The step is in the names, so these are the files of that sketch even if a finer one lands meanwhile.
    const [heights, biomeAt] = await Promise.all([
      fetch(`/preview/data/coarse-${meta.step}-heights.bin`).then(r => r.arrayBuffer()).then(b => new Int16Array(b)),
      fetch(`/preview/data/coarse-${meta.step}-biomes.bin`).then(r => r.arrayBuffer()).then(b => new Uint16Array(b)),
    ]);
    if (heights.length !== meta.samples ** 2 || biomeAt.length !== meta.samples ** 2) return null;
    return { ...meta, heights, biomeAt, colours: meta.biomes.map(b => biomeColour(b.id)), sketch: true };
  }

  // Sizes of the zones made of touching points that share a value. `each(value, size)` gets every zone.
  function zones(valueAt, n, each) {
    const total = n * n;
    const seen = new Uint8Array(total), stack = new Int32Array(total);
    for (let start = 0; start < total; start++) {
      if (seen[start]) continue;
      const value = valueAt[start];
      let size = 0, top = 0;
      stack[top++] = start; seen[start] = 1;
      while (top) {
        const i = stack[--top]; size++;
        const x = i % n;
        if (x > 0 && !seen[i - 1] && valueAt[i - 1] === value) { seen[i - 1] = 1; stack[top++] = i - 1; }
        if (x < n - 1 && !seen[i + 1] && valueAt[i + 1] === value) { seen[i + 1] = 1; stack[top++] = i + 1; }
        if (i >= n && !seen[i - n] && valueAt[i - n] === value) { seen[i - n] = 1; stack[top++] = i - n; }
        if (i < total - n && !seen[i + n] && valueAt[i + n] === value) { seen[i + n] = 1; stack[top++] = i + n; }
      }
      each(value, size);
    }
  }

  function measure(meta, heights, biomeAt) {
    const n = meta.samples, total = n * n, sea = meta.seaLevel;
    const cells = new Float64Array(meta.biomes.length);
    // Sum of (zone area)² per biome: divided by the biome's area, it gives the size of the zone
    // a random point of that biome sits in. Small scattered patches weigh little, as they should.
    const weighted = new Float64Array(meta.biomes.length);
    zones(biomeAt, n, (biome, size) => { cells[biome] += size; weighted[biome] += size * size; });
    // Width of a square of that typical area, in blocks.
    const widths = Array.from(cells, (c, b) => c ? Math.sqrt(weighted[b] / c) * meta.step : 0);

    const level = new Uint8Array(total);
    let ocean = 0, land = 0, flat = 0, high = 0, top = -999;
    for (let i = 0; i < total; i++) {
      const y = heights[i];
      if (y > top) top = y;
      if (y < sea) { ocean++; continue; }
      land++;
      if (y > 150) high++;
      const x = i % n;
      // Level: the ground moves by 2 blocks at most to each neighbour point, one step away.
      // A neighbour under water does not count: a river bed would make every bank a slope.
      const gap = j => heights[j] >= sea ? Math.abs(y - heights[j]) : 0;
      const d = Math.max(x > 0 ? gap(i - 1) : 0, x < n - 1 ? gap(i + 1) : 0, i >= n ? gap(i - n) : 0, i < total - n ? gap(i + n) : 0);
      if (d <= 2) level[i] = 1;
    }
    // 1 where the land is flat, 0 elsewhere: the map draws it, the figures count it.
    // Flat is level ground among level ground: at least 5 of the 9 points around. One level point
    // on a slope is not a place a player would call flat, and one bump does not end a plain.
    const flatAt = new Uint8Array(total);
    for (let i = 0; i < total; i++) {
      if (heights[i] < sea) continue;
      const x = i % n;
      let around = 0;
      for (let dz = -n; dz <= n; dz += n) for (let dx = -1; dx <= 1; dx++) {
        const j = i + dz + dx;
        if (j >= 0 && j < total && x + dx >= 0 && x + dx < n) around += level[j];
      }
      if (around >= 5) { flat++; flatAt[i] = 1; }
    }
    // The flat zone a random flat point sits in, as for the biomes. A river runs through a plain
    // without ending it, so river water joins the zones on its two banks.
    const river = meta.biomes.map(b => /river/.test(b.id));
    const plain = Uint8Array.from(flatAt);
    for (let i = 0; i < total; i++) if (heights[i] < sea && river[biomeAt[i]]) plain[i] = 1;
    let plainCells = 0, plainWeighted = 0;
    zones(plain, n, (isPlain, size) => { if (isPlain) { plainCells += size; plainWeighted += size * size; } });
    let landCells = 0, landWeighted = 0;
    meta.biomes.forEach((b, i) => { if (!isWater(b.id)) { landCells += cells[i]; landWeighted += cells[i] * widths[i]; } });
    return {
      cells, widths, flatAt,
      figures: {
        ocean: 100 * ocean / total, flat: 100 * flat / land, high: 100 * high / land, top,
        expanse: plainCells ? Math.sqrt(plainWeighted / plainCells) * meta.step : 0,
        count: meta.biomes.length, typical: landWeighted / landCells,
        // Two runs compare only over the same area: a wider one holds wider zones.
        span: n * meta.step,
      },
    };
  }

  // The list beside the map holds what the view shows: its biomes, or the bands its colours stand for.
  // Each gives, per point, the row it belongs to, and per row an id, a name, a colour, a size.
  function listOf(kind) {
    if (kind === 'biomes') return { at: world.biomeAt, ids: world.biomes.map(b => b.id), names: world.biomes.map(b => pretty(b.id)), colours: world.colours, cells: world.cells, widths: world.widths };
    // Nothing is measured on a sketch.
    if (world.sketch) return null;
    world.lists ??= {};
    if (kind === 'structures') return world.structures ? world.lists[kind] ??= structureList() : null;
    return world.lists[kind] ??= bands(kind);
  }
  // Structures are counted, not measured in area: a row gives how many there are, and about how far apart.
  function structureList() {
    const s = world.structures, area = (world.samples * world.step) ** 2;
    return { at: null, counted: true, ids: s.ids, names: s.ids.map(pretty), colours: s.colours, cells: s.count,
             widths: Array.from(s.count, c => c ? Math.sqrt(area / c) : 0), total: s.points.length };
  }
  function bands(kind) {
    const n = world.samples, total = n * n, sea = world.seaLevel, h = world.heights, at = new Uint8Array(total);
    let names, colours;
    if (kind === 'height') {
      for (let i = 0; i < total; i++) {
        let band = 0;
        if (h[i] >= sea) { band = 1; while (band <= heightSteps.length && h[i] >= heightSteps[band - 1]) band++; }
        at[i] = band;
      }
      names = text.heightBands(sea, heightSteps);
      // Each band takes the colour of its middle.
      colours = [heightColour(sea - 30, sea), ...[sea, ...heightSteps].map((low, i) => heightColour(i < heightSteps.length ? (low + heightSteps[i]) / 2 : low + 30, sea))];
    } else if (kind === 'temperature') {
      // Five classes over the game's range, from -0.7 to 2; water apart, as on the map.
      const band = world.biomes.map(b => Math.round(clamp((b.temperature + 0.7) / 2.7, 0, 1) * 4));
      for (let i = 0; i < total; i++) at[i] = h[i] < sea ? 5 : band[world.biomeAt[i]];
      names = [...text.legend.temperature, text.legend.water];
      colours = [...text.legend.temperature.map((_, i) => temperatureColour(-0.7 + i * 2.7 / 4)), quietWater];
    } else {
      for (let i = 0; i < total; i++) at[i] = h[i] < sea ? 2 : world.flatAt[i] ? 0 : 1;
      names = text.legend.flat;
      colours = [flatColours.flat, flatColours.steep, flatColours.sea];
    }
    const cells = new Float64Array(names.length), weighted = new Float64Array(names.length);
    zones(at, n, (band, size) => { cells[band] += size; weighted[band] += size * size; });
    return { at, ids: names.map((_, i) => `${i}`), names, colours, cells, widths: Array.from(cells, (c, b) => c ? Math.sqrt(weighted[b] / c) * world.step : 0) };
  }

  // ---------- drawing ----------

  const map = $('map');
  const pen = map.getContext('2d');
  const clamp = (v, low, high) => Math.max(low, Math.min(high, v));
  let drawing3d = Promise.resolve(), drawingCut = Promise.resolve();

  function paint() {
    if (!world) return;
    if (view === 'section' && !exporting) { drawingCut = showCut(); return; }
    const marks = view === 'structures';
    map.classList.toggle('marks', marks);
    // The land under the structures does not change when the marks do: it is kept, and only the marks are drawn again.
    if (marks && quiet?.world === world && quiet.dark === scheme.matches) { drawMarks(); return; }
    const n = world.samples, total = n * n, h = world.heights, sea = world.seaLevel, at = world.biomeAt;
    if (!marks) map.width = map.height = n;
    const image = pen.createImageData(n, n), px = image.data;
    // What is not a chosen biome steps back towards the ground: water, then land.
    const stepBack = scheme.matches ? [16, 40] : [200, 226];
    // The line between two zones that stepped back: a little towards the text's side of the ground.
    const fadedLine = scheme.matches ? 1.3 : 0.92;
    // The choice of this view only. A chosen row this world does not have dims nothing.
    const list = marks ? null : listOf(view), rowAt = list?.at;
    const lit = list ? list.ids.map(id => chosen[view].has(id)) : [], choosing = !exporting && lit.includes(true);
    for (let i = 0; i < total; i++) {
      const biome = at[i], y = h[i], x = i % n, water = y < sea;
      // Light from the north-west: slopes facing it are brighter. Water stays flat.
      let slope = 0;
      if (!water) {
        const west = x > 0 ? h[i - 1] : y, east = x < n - 1 ? h[i + 1] : y;
        const north = i >= n ? h[i - n] : y, south = i < total - n ? h[i + n] : y;
        slope = (east - west) + (south - north);
      }
      // Where the biome changes. Not between two kinds of sea, which would only add noise.
      const right = x < n - 1 ? i + 1 : i, below = i < total - n ? i + n : i;
      const border = (at[right] !== biome && !(water && h[right] < sea)) || (at[below] !== biome && !(water && h[below] < sea));
      let c, shade = 1;
      if (choosing && !lit[rowAt[i]]) {
        const g = stepBack[water ? 0 : 1];
        c = [g, g, g]; shade = clamp(1 + slope * 0.004, 0.9, 1.1);
        // What stepped back keeps a trace of its zones, so a chosen biome is still read among its neighbours.
        if (border && view === 'biomes') shade *= fadedLine;
      } else if (marks) {
        // The land stepped back, its relief a little stronger than a choice leaves it, to place the marks on.
        const g = stepBack[water ? 0 : 1];
        c = [g, g, g]; shade = water ? 1 : clamp(1 + slope * 0.008, 0.82, 1.18);
      } else if (view === 'height') {
        c = heightColour(y, sea); shade = clamp(1 + slope * 0.012, 0.75, 1.25);
      } else if (view === 'temperature') {
        c = water ? quietWater : temperatureColour(world.biomes[biome].temperature);
        shade = clamp(1 + slope * 0.006, 0.85, 1.15);
      } else if (view === 'flat') {
        // A sketch does not say where the land is flat: its land stays neutral.
        const g = stepBack[1];
        c = water ? flatColours.sea : world.sketch ? [g, g, g] : world.flatAt[i] ? flatColours.flat : flatColours.steep;
      } else {
        c = world.colours[biome];
        // Here the lightness says which biome it is, so the relief may only touch it lightly.
        shade = clamp(1 + slope * 0.006, 0.85, 1.15);
        // A dark line where the biome changes: two neighbours of one colour family stay two zones.
        // Lighter on a pale biome, where it would turn into a heavy grey maze; stronger on a dark one.
        if (border) shade *= c[0] + c[1] + c[2] > 420 ? 0.75 : 0.5;
      }
      px[i * 4] = c[0] * shade; px[i * 4 + 1] = c[1] * shade; px[i * 4 + 2] = c[2] * shade; px[i * 4 + 3] = 255;
    }
    if (marks) {
      const land = document.createElement('canvas');
      land.width = land.height = n;
      land.getContext('2d').putImageData(image, 0, 0);
      quiet = { world, dark: scheme.matches, land };
      drawMarks();
      return;
    }
    pen.putImageData(image, 0, 0);
    if (in3d && !exporting) drawing3d = refresh3d();
  }

  // The structures' canvas is 2048 pixels a side whatever the area: a mark is drawn finer than a point of the
  // map, so it stays round and crisp from 256 to 2048 points a side, and in 3D, where the canvas is the texture.
  const marksSide = 2048;
  let quiet = null;   // the land under the marks, at the map's own points: { world, dark, land }
  function drawMarks() {
    const s = world.structures, n = world.samples;
    map.width = map.height = marksSide;
    pen.imageSmoothingEnabled = false;
    pen.drawImage(quiet.land, 0, 0, marksSide, marksSide);
    if (s) {
      // A mark keeps about its size on screen however close the map is looked at, growing a little as it
      // comes closer. Seen in 3D or in an exported picture, from afar, it is a little larger.
      const far = in3d || exporting, shown = $('flat').clientWidth || $('relief').clientWidth || 700;
      const pixel = marksSide / shown / (far ? 1 : look.k ** 0.8);
      const radius = (far ? 4.5 : 3.5) * pixel, toCanvas = marksSide / (n * world.step);
      const picked = chosen.structures, choosing = !exporting && s.ids.some(id => picked.has(id));
      const lit = kind => !choosing || picked.has(s.ids[kind]);
      // What is not chosen steps back to a small grey dot: still a place, no longer a kind.
      const dot = (kind, r) => {
        pen.beginPath();
        for (const [, x, z] of s.byKind[kind]) {
          const cx = (x - world.originX) * toCanvas, cy = (z - world.originZ) * toCanvas;
          pen.moveTo(cx + r, cy); pen.arc(cx, cy, r, 0, 2 * Math.PI);
        }
      };
      pen.fillStyle = scheme.matches ? '#6a6a6a' : '#8a8a86';
      for (const kind of s.order) if (!lit(kind)) { dot(kind, radius * 0.45); pen.fill(); }
      // A dark ring keeps a pale mark apart from pale ground, and two touching marks apart from each other.
      pen.lineWidth = pixel; pen.strokeStyle = 'rgb(0 0 0 / 0.7)';
      for (const kind of s.order) if (lit(kind)) {
        dot(kind, radius);
        pen.fillStyle = css(s.colours[kind]); pen.fill(); pen.stroke();
      }
    }
    if (in3d && !exporting) drawing3d = refresh3d();
  }
  // The nearest structure to a point of the screen, if one is close enough to be the one pointed at.
  function structureNear(event) {
    const s = world?.structures;
    if (!s || world.sketch) return null;
    const box = map.getBoundingClientRect(), span = world.samples * world.step;
    const x = world.originX + (event.clientX - box.left) / box.width * span, z = world.originZ + (event.clientY - box.top) / box.height * span;
    // Within about the mark's own radius, a little more.
    let best = null, reach = (6 * span / box.width) ** 2;
    for (const point of s.points) {
      const d = (point[1] - x) ** 2 + (point[2] - z) ** 2;
      if (d < reach) { reach = d; best = point; }
    }
    return best;
  }

  function showFigures() {
    const f = world.figures, b = before && before.span === f.span ? before : null;
    const format = { ocean: percent, flat: percent, high: percent, top: text.altitude, count: v => `${v}`, typical: blocks, expanse: blocks };
    // What moved since the run before, counted on the values as they are shown: [rounding step, decimals].
    const grain = { ocean: [0.1, 1], flat: [0.1, 1], high: [0.1, 1], top: [1, 0], count: [1, 0], typical: [50, 0], expanse: [50, 0] };
    const change = key => {
      const [step, digits] = grain[key];
      const steps = Math.round(f[key] / step) - Math.round(b[key] / step);
      if (steps === 0) return text.same;
      // A width is rounded to 50 blocks: one step of it is not a change worth a number.
      if (step === 50 && Math.abs(steps) === 1) return text.close;
      // Two shares differ by points, not by percent.
      return (steps > 0 ? '+' : '−') + num(Math.abs(steps) * step, digits) + (step === 0.1 ? text.points : '');
    };
    const cell = (content, className) => {
      const span = document.createElement('span');
      span.textContent = content; span.className = className;
      return span;
    };
    const rows = [];
    // The second column needs a name only once there is something in it.
    if (b) rows.push(cell('', ''), cell('', ''), cell(text.change, 'head'));
    for (const key of Object.keys(text.figureNames)) {
      const [name, base, definition] = text.figureNames[key];
      const goal = text.goalFigures.includes(key);
      // The figures that answer the goal come first and larger; a line sets the others apart.
      if (key === 'ocean') rows.push(cell('', 'rule'));
      const label = cell(name, '');
      if (base) { const note = document.createElement('small'); note.textContent = ` ${base}`; label.append(note); }
      if (definition) label.title = definition;
      const moved = cell(b && b[key] != null ? change(key) : '', goal ? 'before goal-change' : 'before');
      if (moved.textContent) moved.title = text.was(format[key](b[key]));
      rows.push(label, cell(format[key](f[key]), goal ? 'value goal' : 'value'), moved);
    }
    $('figures').replaceChildren(...rows);
  }

  function showList() {
    // The section's list is its ores, filled when the cut is drawn.
    if (view === 'section') return;
    const list = listOf(view), total = world.samples ** 2, counted = view === 'structures';
    const heads = counted ? [[text.colSpacing, text.colSpacingHint], [text.colCount, '']] : [[text.colWidth, ''], [text.colShare, '']];
    heads.forEach(([name, hint], i) => { const head = $('listHead').children[i + 2]; head.textContent = name; head.title = hint; });
    [$('listTitle').textContent, $('listColumn').textContent] = text.lists[view];
    // A long list of names gets a filter: the biomes, and the structures a mod may add by dozens.
    $('filter').hidden = !list || (view !== 'biomes' && !counted);
    $('listHead').hidden = !list;
    // Biomes by share, structures by count. Bands keep their own order, lowest or coldest first; one this world does not have is left out.
    const order = list ? list.ids.map((_, i) => i).filter(i => list.cells[i]) : [];
    if (view === 'biomes' || counted) order.sort((a, b) => list.cells[b] - list.cells[a]);
    $('biomes').replaceChildren(...order.map(i => {
      const row = document.createElement('button');
      row.className = 'biome num';
      row.dataset.id = list.ids[i];
      row.innerHTML = '<i></i><span class="name"></span><span class="width"></span><span class="share"></span>';
      row.children[0].style.background = css(list.colours[i]);
      if (counted) row.children[0].className = 'mark';
      row.children[1].textContent = list.names[i];
      if (view === 'biomes' || counted) row.title = list.ids[i];
      row.children[2].textContent = blocks(list.widths[i]);
      row.children[3].textContent = counted ? num(list.cells[i]) : percent(100 * list.cells[i] / total);
      row.addEventListener('click', () => choose(list.ids[i]));
      return row;
    }));
    showChoice();
  }

  // Each click adds a row to the choice or takes it out; the map shows the chosen ones alone.
  function choose(id) {
    if (!chosen[view].delete(id)) chosen[view].add(id);
    showChoice(); paint();
  }
  // Marks the rows, hides those the filter leaves out, and says what the choice weighs.
  // The rows are not rebuilt, so the list stays where it was scrolled.
  function showChoice() {
    const list = listOf(view), picked = chosen[view];
    if (!list) { $('pick').replaceChildren(); return; }
    const asked = !$('filter').hidden ? $('filter').value.trim().toLowerCase() : '';
    const rows = [];
    let cells = 0;
    list.ids.forEach((id, i) => { if (picked.has(id) && list.cells[i]) { cells += list.cells[i]; rows.push(i); } });
    $('biomes').classList.toggle('choosing', rows.length > 0);
    for (const row of $('biomes').children) {
      const on = picked.has(row.dataset.id);
      row.setAttribute('aria-pressed', on);
      // The filter reads the id too, so the name of a mod finds its biomes. A chosen biome stays in sight.
      row.hidden = !on && !!asked && !row.dataset.id.replaceAll('_', ' ').includes(asked);
    }
    if (!rows.length) { $('pick').replaceChildren(text.pickHint); return; }
    const none = document.createElement('button');
    none.textContent = text.pickNone;
    none.addEventListener('click', () => { picked.clear(); showChoice(); paint(); });
    none.className = 'none';
    // Up to three, the choice is named, since its rows may be far apart in the list. A name takes its row out.
    const parts = rows.length > 3 ? [text.pickedMany(rows.length)] : rows.flatMap((i, at) => {
      const name = document.createElement('button');
      name.textContent = list.names[i];
      name.title = text.pickRemove(list.names[i]);
      name.addEventListener('click', () => choose(list.ids[i]));
      return at ? [', ', name] : [name];
    });
    $('pick').replaceChildren(...parts, list.counted ? text.pickedCount(num(cells), num(list.total)) : text.pickedShare(percent(100 * cells / world.samples ** 2)), none);
  }
  $('filter').addEventListener('input', () => { if (world && !world.sketch && view !== 'section') showChoice(); });

  const restProbe = () => {
    if (view === 'section') { restCut(); return; }
    if (world) $('probe').textContent = text.area(num(world.samples * world.step), num(world.samples * world.step / 8), !$('cutLine').hidden);
  };
  function showWorld() {
    showRows(); showTabs(); showFigures(); showList(); restProbe(); showButton();
  }

  const pointUnder = event => {
    const box = map.getBoundingClientRect(), n = world.samples;
    const col = Math.min(n - 1, Math.floor((event.clientX - box.left) / box.width * n));
    const row = Math.min(n - 1, Math.floor((event.clientY - box.top) / box.height * n));
    return [col, row, row * n + col];
  };

  // The flat map moves like the relief does: the wheel comes closer to the point under it, a press that
  // travels carries the map. A press that stays in place is still the click that chooses a biome.
  const flat = $('flat'), look = { k: 1, x: 0, y: 0 };
  let marking = 0;
  function showLook() {
    look.x = clamp(look.x, 1 - look.k, 0); look.y = clamp(look.y, 1 - look.k, 0);
    for (const key in look) flat.style.setProperty(`--${key}`, look[key]);
    showCutLine();
    // The marks keep their size on screen: drawn again once per frame at most.
    if (view === 'structures' && quiet?.world === world && !marking) marking = requestAnimationFrame(() => { marking = 0; drawMarks(); });
  }
  // Where the section's cut runs on the map: its line of the map, followed as the map is looked at closer.
  function showCutLine() {
    const section = world?.section, line = $('cutLine');
    const at = section && !world.sketch ? (section.cuts[section.at].z - world.originZ) / (world.samples * world.step) : -1;
    const y = look.y + at * look.k;
    line.hidden = view === 'section' || in3d || $('flat').hidden || !(at >= 0 && y >= 0 && y <= 1);
    line.style.top = `${y * 100}%`;
  }
  map.addEventListener('wheel', event => {
    event.preventDefault();
    const box = flat.getBoundingClientRect();
    const px = (event.clientX - box.left) / box.width, py = (event.clientY - box.top) / box.height;
    const k = clamp(look.k * (event.deltaY < 0 ? 1.25 : 0.8), 1, 16);
    look.x = px - (px - look.x) * k / look.k; look.y = py - (py - look.y) * k / look.k; look.k = k;
    showLook();
  }, { passive: false });
  let carry = null, carried = false;
  map.addEventListener('pointerdown', event => {
    if (event.button === 0) { carry = { x: event.clientX, y: event.clientY, lookX: look.x, lookY: look.y }; carried = false; }
  });
  map.addEventListener('pointermove', event => {
    if (!carry) return;
    const dx = event.clientX - carry.x, dy = event.clientY - carry.y;
    // A hand is never still: a few pixels are not yet a move.
    if (!carried && Math.hypot(dx, dy) < 4) return;
    if (!carried) { carried = true; map.setPointerCapture(event.pointerId); map.style.cursor = 'grabbing'; }
    const box = flat.getBoundingClientRect();
    look.x = carry.lookX + dx / box.width; look.y = carry.lookY + dy / box.height;
    showLook();
  });
  for (const end of ['pointerup', 'pointercancel']) map.addEventListener(end, () => { carry = null; map.style.cursor = ''; });

  // A sketch has no list to mirror the choice: nothing is chosen on it.
  map.addEventListener('click', event => {
    if (carried || !world || world.sketch) return;
    if (view === 'structures') { const near = structureNear(event); if (near) choose(world.structures.ids[near[0]]); return; }
    const list = listOf(view);
    choose(list.ids[list.at[pointUnder(event)[2]]]);
  });
  map.addEventListener('mousemove', event => {
    if (!world) return;
    const near = view === 'structures' ? structureNear(event) : null;
    if (near) { $('probe').textContent = text.structureProbe(num(near[1]), num(near[2]), pretty(world.structures.ids[near[0]])); return; }
    const [col, row, i] = pointUnder(event);
    $('probe').textContent = text.probe(num(world.originX + col * world.step), num(world.originZ + row * world.step),
      world.heights[i], pretty(world.biomes[world.biomeAt[i]].id));
  });
  map.addEventListener('mouseleave', restProbe);

  // ---------- the 3D view: the same map, draped over the real heights ----------

  let scene3d = null;
  const groundColour = () => getComputedStyle(document.documentElement).getPropertyValue('--ground').trim();
  async function refresh3d() {
    try {
      if (!scene3d) {
        const THREE = await import('three');
        const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
        const host = $('relief');
        // From ten blocks to two hundred thousand, the plain depth test cannot tell the sea from a shore one
        // block above it, and the two flicker; the logarithmic one keeps them apart at any distance.
        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setPixelRatio(devicePixelRatio);
        host.append(renderer.domElement);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, 1, 10, 200000);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.enableDamping = true;
        const draw = () => {
          if (host.hidden) { scene3d.running = false; return; }
          const size = host.clientWidth;
          renderer.setSize(size, size, false);
          controls.update();
          renderer.render(scene, camera);
          requestAnimationFrame(draw);
        };
        // A picture of the relief as it is looked at, whether the view is on screen or not. Taken in the
        // same breath as the drawing, before the browser clears what was drawn.
        const shot = size => {
          renderer.setSize(size / devicePixelRatio, size / devicePixelRatio, false);
          controls.update();
          renderer.render(scene, camera);
          return new Promise(resolve => renderer.domElement.toBlob(resolve));
        };
        scene3d = { THREE, scene, camera, controls, draw, shot, land: null, water: null, running: false, width: 0 };
      }
      const { THREE, scene } = scene3d;
      scene.background = new THREE.Color(groundColour());
      const n = world.samples, width = n * world.step;
      if (scene3d.width !== width) {
