      texture.magFilter = map.width === marksSide && view === 'structures' ? THREE.LinearFilter : THREE.NearestFilter;
      scene3d.land = new THREE.Mesh(ground, new THREE.MeshBasicMaterial({ map: texture }));
      // Half a block under the sea level: ground at that level is land, and must not lie in the sheet of water.
      scene3d.water = new THREE.Mesh(
        new THREE.PlaneGeometry(width, width).rotateX(-Math.PI / 2).translate(0, world.seaLevel - 0.5, 0),
        // Clearer over the Relief view, so the floor is read through it.
        new THREE.MeshBasicMaterial({ color: 0x2f5c9e, transparent: true, opacity: view === 'height' ? 0.25 : 0.6 }));
      scene.add(scene3d.land, scene3d.water);
      if (!scene3d.running) { scene3d.running = true; scene3d.draw(); }
    } catch { $('note').textContent = text.no3d; }
  }

  // ---------- the section: a cut through the ground, and the ores played on it ----------

  // The ground of a cut is the generator's own answer, cell by cell. The ores are not: a real ore needs
  // its chunk generated. They are played here instead, from the rules the server loaded (the placement
  // steps of each ore, as a data pack writes them), with the game's own way of drawing a height and of
  // shaping a vein. So the cut shows where the rules put ore and about how much, not the blocks a
  // world of this seed would hold.
  const oreColours = { coal: [24, 24, 24], copper: [231, 124, 86], iron: [227, 192, 170], gold: [252, 238, 75],
                       lapis: [42, 95, 208], redstone: [255, 31, 31], diamond: [93, 236, 245], emerald: [23, 221, 98] };
  const oreKinds = Object.keys(oreColours);
  const cutColours = { water: [47, 92, 158], lava: [226, 102, 26], rock: [128, 128, 128], deep: [80, 80, 86], earth: [139, 99, 68] };
  // The top layers of the ground are earth, sand or gravel, which no ore replaces: about this many blocks.
  const earthDepth = 3;
  // Ore near the ground is counted down to this depth, apart under low and under high ground.
  const nearDepth = 64, highGround = 80;
  // Chunk plays counted for the figures, whatever the length of the cut: 512, as a cut of 2048 blocks played
  // four times. A short cut is played several times over, a long one one chunk in so many: the figures keep
  // about the same steadiness, and a row typed in costs the same time.
  const countedChunks = 512;
  // The ores drawn are those of a slice this thick, in blocks across the cut.
  const drawnSlice = [6, 10];
  const caveColour = [46, 42, 40];

  const bare = id => `${id}`.replace(/^minecraft:/, '');
  function oreKind(rule) {
    const state = rule.config?.targets?.[0]?.state, id = typeof state === 'string' ? state : state?.Name;
    const found = /:(?:deepslate_)?(coal|copper|iron|gold|lapis|redstone|diamond|emerald)_ore$/.exec(id || '');
    return found ? found[1] : null;
  }
  // A number a data pack may write as a plain value or as a draw between two bounds.
  const bounds = v => typeof v === 'number' ? [v, v] : !v ? null
    : /constant$/.test(v.type) ? bounds(v.value)
    : /uniform$/.test(v.type) ? [v.min_inclusive ?? v.value?.min_inclusive, v.max_inclusive ?? v.value?.max_inclusive] : null;
  const steps = new Set(['count', 'rarity_filter', 'in_square', 'height_range', 'heightmap', 'offset', 'biome']);
  const heights = new Set(['constant', 'uniform', 'trapezoid', 'biased_to_bottom', 'very_biased_to_bottom']);
  const playable = rule => rule.placement.every(step => steps.has(bare(step.type))
    && (bare(step.type) !== 'count' || bounds(step.count))
    && (bare(step.type) !== 'offset' || (bounds(step.x) && bounds(step.y) && bounds(step.z)))
    && (bare(step.type) !== 'height_range' || heights.has(bare(step.height.type))));
  // A rule that counts its depth from the ground: the ground's height, then steps down. Those are the
  // rows that can be changed here.
  function anchored(rule) {
    const types = rule.placement.map(step => bare(step.type));
    const at = types.indexOf('heightmap');
    if (at < 0 || types.includes('height_range')) return null;
    let from = 0, to = 0;
    for (const step of rule.placement.slice(at + 1)) {
      if (bare(step.type) !== 'offset') continue;
      const y = bounds(step.y);
      if (!y) return null;
      from -= y[1]; to -= y[0];
    }
    const count = bounds(rule.placement.find(step => bare(step.type) === 'count')?.count ?? 1);
    return count && from >= 0 ? { count: count[1], from, to } : null;
  }
  // The same depth written the way a data pack must: a step down is 16 blocks at most, so a depth is
  // several steps, each drawn between its share of the two bounds.
  function stepsDown(from, to) {
    const parts = Math.max(1, Math.ceil(to / 16)), list = [];
    for (let i = 0; i < parts; i++) {
      const share = v => Math.round(v * (i + 1) / parts) - Math.round(v * i / parts);
      list.push({ type: 'offset', x: 0, y: { type: 'uniform', min_inclusive: -share(to), max_inclusive: -share(from) }, z: 0 });
    }
    return list;
  }

  async function loadSection() {
    const read = file => fetch(`/preview/data/${file}`).then(r => r.ok ? r.json() : null).catch(() => null);
    const [meta, ores] = await Promise.all([read('section.json'), read('ores.json')]);
    if (!meta?.cuts?.length || !ores) return null;
    const rules = ores.placements.map((rule, index) => ({ ...rule, index, kind: oreKind(rule) })).filter(rule => rule.kind);
    for (const rule of rules) { rule.playable = playable(rule); rule.anchored = rule.playable ? anchored(rule) : null; }
    return { ...meta, rules, biomes: ores.biomes, cells: [], at: 0 };
  }

  // What is added under the ground: one row per ore, kept by the browser once changed. Until then the
  // rows are the anchored rules the server loaded, so a pack that already adds such ores shows its own.
  let oreRows = null, withoutAdded = false, cutShown = null;
  // The line of the last cut shown, kept through a run: the sketches have no cut, and forget cutShown.
  let keptCut = null;
  try { oreRows = JSON.parse(localStorage.getItem('preview.oreRows')); } catch { }
  const rowsOfMods = section => section.rules.filter(rule => rule.anchored).map(rule => ({ id: rule.id, kind: rule.kind, ...rule.anchored }));
  function keepRows(rows) {
    oreRows = rows;
    try { if (rows) localStorage.setItem('preview.oreRows', JSON.stringify(rows)); else localStorage.removeItem('preview.oreRows'); } catch { }
  }

  // A draw of numbers that depends on its name alone: the same rule gives the same veins from one
  // change of a row to the next, so only what was changed moves on the cut.
  function drawOf(name) {
    let a = Math.floor(hashOf(name) * 4294967296) | 0;
    return () => {
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // The ground of a cut, once per cut: two heights per column, as the game keeps them (the first block that is
  // not air, and the first that is neither air nor water, the sea floor under a sea), whether each chunk is
  // under low or high ground, and the surface biome that says which rules a chunk plays.
  function groundOf(section, cells, cut) {
    const L = section.length, H = section.height, minY = section.minY, topY = minY + H - 1;
    const surface = new Int16Array(L).fill(minY), floor = new Int16Array(L).fill(minY);
    for (let x = 0; x < L; x++) {
      let seen = false;
      for (let y = topY; y >= minY; y--) {
        const cell = cells[(topY - y) * L + x];
        if (cell && !seen) { surface[x] = y + 1; seen = true; }
        if (cell === 1 || cell === 3) { floor[x] = y + 1; break; }
      }
    }
    const chunks = L >> 4, high = new Uint8Array(chunks), biomes = [];
    const row = clamp(Math.round((cut.z - world.originZ) / world.step), 0, world.samples - 1);
    for (let c = 0; c < chunks; c++) {
      high[c] = Array.from(floor.subarray(c * 16, c * 16 + 16)).sort((a, b) => a - b)[8] >= highGround;
      const col = clamp(Math.floor((cut.x + c * 16 - world.originX) / world.step), 0, world.samples - 1);
      biomes.push(world.biomes[world.biomeAt[row * world.samples + col]]?.id);
    }
    let top = minY, bottom = topY, peak = 0;
    for (let x = 0; x < L; x++) { if (surface[x] > top) { top = surface[x]; peak = x; } bottom = Math.min(bottom, floor[x]); }
    // The empty sky above the highest ground is left out of the drawing.
    const crop = Math.max(0, topY - top - 24);
    return { surface, floor, chunks, high, biomes, top, bottom, peak, crop, rows: H - crop };
  }

  // Plays every ore rule on a cut, chunk by chunk: each chunk takes the rules its surface biome lists. A row
  // takes the place of the anchored rule it came from; a row added here goes to every chunk, with the vein of
  // the most tried rule of its ore. Each chunk draws its own numbers, from its name alone, so a chunk gives
  // the same veins whatever was played before it: the figures can be counted on some chunks and the ores
  // drawn on others, the ones on screen, each only once.
  function orePlay(section, cells, cut, ground, rows) {
    const L = section.length, H = section.height, minY = section.minY, topY = minY + H - 1;
    const { surface, floor, chunks, high, biomes } = ground;
    const cellAt = (x, y) => x < 0 || x >= L || y < minY || y > topY ? 0 : cells[(topY - y) * L + x];
    const int = (v, draw) => { const [low, top] = bounds(v); return low + Math.floor(draw() * (top - low + 1)); };
    const anchor = v => 'absolute' in v ? v.absolute : 'above_bottom' in v ? minY + v.above_bottom : topY - v.below_top;
    const between = (low, top, draw) => top < low ? low : low + Math.floor(draw() * (top - low + 1));
    // The game's own draws of a height (HeightProvider and its kinds).
    const height = (h, draw) => {
      const kind = bare(h.type);
      if (kind === 'constant') return anchor(h.value);
      const low = anchor(h.min_inclusive), top = anchor(h.max_inclusive);
      if (kind === 'uniform') return between(low, top, draw);
      if (kind === 'trapezoid') {
        const plateau = h.plateau ?? 0;
        if (plateau >= top - low) return between(low, top, draw);
        const side = Math.floor((top - low - plateau) / 2);
        return low + Math.floor(draw() * (top - low - side + 1)) + Math.floor(draw() * (side + 1));
      }
      const inner = h.inner ?? 1;
      if (kind === 'biased_to_bottom') return low + Math.floor(draw() * (Math.floor(draw() * Math.max(1, top - low - inner + 1)) + inner));
      const first = between(low + inner, top, draw), second = between(low, first - 1, draw);
      return between(low, second - 1 + inner, draw);
    };
    // Where a rule tries, in one chunk: its steps, one after the other, each turning a place into none, one or several.
    const tries = (placement, x0, draw) => {
      let places = [[x0, 0, 0]];
      for (const step of placement) {
        const next = [];
        for (const [x, y, z] of places) {
          switch (bare(step.type)) {
            case 'count': for (let n = int(step.count, draw); n > 0; n--) next.push([x, y, z]); break;
            case 'rarity_filter': if (draw() < 1 / step.chance) next.push([x, y, z]); break;
            case 'in_square': next.push([x + Math.floor(draw() * 16), y, z + Math.floor(draw() * 16)]); break;
            case 'height_range': next.push([x, height(step.height, draw), z]); break;
            case 'heightmap': {
              const ground = (/OCEAN_FLOOR/.test(step.heightmap) ? floor : surface)[clamp(x, 0, L - 1)];
              if (ground > minY) next.push([x, ground, z]);
              break;
            }
            case 'offset': next.push([x + int(step.x, draw), y + int(step.y, draw), z + int(step.z, draw)]); break;
            default: next.push([x, y, z]);
          }
        }
        places = next;
      }
      return places;
    };
    // A vein, the way the game's ore feature shapes it: balls along a short slanted line.
    const vein = (ox, oy, oz, size, draw, put) => {
      const angle = draw() * Math.PI, reach = size / 8;
      const x0 = ox + Math.sin(angle) * reach, x1 = ox - Math.sin(angle) * reach;
      const z0 = oz + Math.cos(angle) * reach, z1 = oz - Math.cos(angle) * reach;
      const y0 = oy + Math.floor(draw() * 3) - 2, y1 = oy + Math.floor(draw() * 3) - 2;
      // Each ball is four numbers in a row: its centre, then its radius.
      if (balls.length < size * 4) balls = new Float64Array(size * 4);
      for (let i = 0; i < size; i++) {
        const t = i / size, r = draw() * size / 16;
        balls[i * 4] = x0 + (x1 - x0) * t; balls[i * 4 + 1] = y0 + (y1 - y0) * t; balls[i * 4 + 2] = z0 + (z1 - z0) * t;
        balls[i * 4 + 3] = ((Math.sin(Math.PI * t) + 1) * r + 1) / 2;
      }
      // A ball inside another one adds nothing.
      for (let i = 0; i < size - 1; i++) for (let j = i + 1; j < size; j++) {
        const a = i * 4, b = j * 4;
        if (balls[a + 3] <= 0 || balls[b + 3] <= 0) continue;
        const gap = balls[a + 3] - balls[b + 3], dx = balls[a] - balls[b], dy = balls[a + 1] - balls[b + 1], dz = balls[a + 2] - balls[b + 2];
        if (gap * gap > dx * dx + dy * dy + dz * dz) { if (gap > 0) balls[b + 3] = -1; else balls[a + 3] = -1; }
      }
      // A block two balls share is placed once. The blocks met are marked in a box around the try, as the game
      // does with its own bit set: far cheaper than a set of keys, and the veins are where a play spends its time.
      stamp++;
      const bx = Math.floor(ox) - 16, by = oy - 16, bz = Math.floor(oz) - 16;
      for (let b = 0; b < size * 4; b += 4) {
        const cx = balls[b], cy = balls[b + 1], cz = balls[b + 2], r = balls[b + 3];
        if (r < 0) continue;
        for (let x = Math.floor(cx - r); x <= Math.floor(cx + r); x++) {
          const dx = (x + 0.5 - cx) / r;
          for (let y = Math.floor(cy - r); y <= Math.floor(cy + r); y++) {
            const dy = (y + 0.5 - cy) / r;
            for (let z = Math.floor(cz - r); z <= Math.floor(cz + r); z++) {
              const dz = (z + 0.5 - cz) / r;
              if (dx * dx + dy * dy + dz * dz >= 1) continue;
              const i = x - bx, j = y - by, l = z - bz;
              if (i >= 0 && i < 32 && j >= 0 && j < 32 && l >= 0 && l < 32) {
                const at = (i << 10) | (j << 5) | l;
                if (met[at] === stamp) continue;
                met[at] = stamp;
              }
              put(x, y, z);
            }
          }
        }
      }
    };
    const met = new Int32Array(32768);
    let stamp = 0, balls = new Float64Array(128);

    const veinOf = kind => section.rules.filter(rule => rule.kind === kind && rule.playable && !rule.anchored)
      .sort((a, b) => (bounds(b.placement[0].count)?.[1] ?? 0) - (bounds(a.placement[0].count)?.[1] ?? 0))[0];
    const plays = [];
    for (const rule of section.rules) if (rule.playable && !rule.anchored) plays.push({ rule, name: rule.id, kind: rule.kind, config: rule.config, placement: rule.placement });
    if (!withoutAdded) for (const added of rows) {
      const rule = section.rules.find(r => r.id === added.id), config = (rule ?? veinOf(added.kind))?.config;
      if (!config || !(added.count > 0) || added.to < added.from) continue;
      plays.push({ rule, name: added.id, kind: added.kind, config, everywhere: !rule, placement: [
        { type: 'count', count: added.count }, { type: 'in_square' }, { type: 'heightmap', heightmap: 'OCEAN_FLOOR_WG' }, ...stepsDown(added.from, added.to)] });
    }
    // One rule played on one chunk, `put` called with every block of ore it places. `nearOnly` leaves out the
    // tries too deep to reach the counted depth: most tries are deep, and the figures only count near the ground.
    const playChunk = (play, c, replay, put, nearOnly) => {
      if (!play.everywhere && !section.biomes[biomes[c]]?.includes(play.rule.index)) return;
      const draw = drawOf(`${world.seed}/${section.at}/${play.name}/${c}/${replay}`);
      const skipAir = play.config.discard_chance_on_air_exposure ?? 0;
      const keep = (x, y, z) => {
        if (cellAt(x, y) !== 1 || (y < floor[x] && y >= floor[x] - earthDepth)) return;
        // A vein in the open is often thrown away, block by block: the game looks at the six neighbours, the cut has four.
        if (skipAir > 0 && (skipAir >= 1 || draw() < skipAir) && !(cellAt(x - 1, y) && cellAt(x + 1, y) && cellAt(x, y - 1) && cellAt(x, y + 1))) return;
        put(x, y, z);
      };
      for (const [x, y, z] of tries(play.placement, c * 16, draw)) {
        // A try far above the ground meets only air; a vein reaches 12 blocks at most from its try.
        const a = floor[clamp(x - 8, 0, L - 1)], b = floor[clamp(x, 0, L - 1)], d = floor[clamp(x + 8, 0, L - 1)];
        if (y <= minY || y - 12 > Math.max(a, b, d)) continue;
        if (nearOnly && y + 12 < Math.min(a, b, d) - nearDepth) continue;
        vein(x, y, z, play.config.size, draw, keep);
      }
    };

    // The figures: blocks per chunk near the ground, under low and under high ground, counted over a sample
    // of the same size whatever the length of the cut (every chunk several times over, or one in so many).
    const sample = [], replays = Math.max(1, Math.round(countedChunks / chunks));
    if (chunks <= countedChunks) for (let c = 0; c < chunks; c++) sample.push(c);
    else for (let i = 0; i < countedChunks; i++) sample.push(Math.floor((i + 0.5) * chunks / countedChunks));
    const playedIn = [0, 0];
    for (const c of sample) playedIn[high[c]] += replays;
    const perChunk = {};
    for (const play of plays) {
      const near = [0, 0];
      for (const c of sample) for (let replay = 0; replay < replays; replay++) playChunk(play, c, replay, (x, y) => {
        const depth = floor[x] - y;
        if (depth >= 1 && depth <= nearDepth) near[high[c]]++;
      }, true);
      const ore = perChunk[play.kind] ??= { low: 0, high: 0, from: [] };
      ore.low += playedIn[0] ? near[0] / playedIn[0] : 0;
      ore.high += playedIn[1] ? near[1] / playedIn[1] : 0;
      ore.from.push(play.name);
    }
    for (const ore of Object.values(perChunk)) { if (!playedIn[0]) ore.low = null; if (!playedIn[1]) ore.high = null; }

    // The ores drawn: those of a thin slice across the cut, or the cut would be covered with ore, played on
    // the chunks looked at only, as they come into sight, once each.
    const layer = new Uint8Array(L * H), drawn = new Uint8Array(chunks);
    const drawChunks = (from, to) => {
      for (let c = Math.max(0, from); c <= Math.min(chunks - 1, to); c++) {
        if (drawn[c]) continue;
        drawn[c] = 1;
        for (const play of plays) {
          const kind = oreKinds.indexOf(play.kind) + 1;
          playChunk(play, c, 0, (x, y, z) => { if (z >= drawnSlice[0] && z < drawnSlice[1]) layer[(topY - y) * L + x] = kind; });
        }
      }
    };
    return { perChunk, layer, drawChunks, counted: sample.length * replays };
  }

  // The cut is looked at through a window, at true scale: k screen pixels per block, x and y where the cut's
  // corner went, in screen pixels. Only what the window shows is drawn, since a cut as long as the scanned
  // area is far wider than a canvas may be. Above it, the whole cut drawn small says where the window is.
  const cutView = $('cutView'), cutCanvas = $('cutCanvas'), cutLook = { k: 0, x: 0, y: 0 };
  let cutFrame = 0;
  function showCutLook() {
    if (!cutShown || view !== 'section') return;
    const { section, ground } = cutShown, box = cutView.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const [fit, least] = cutScales(box);
    // A new cut is first looked at around its highest ground, which fills the window's height at true
    // scale: elsewhere a low stretch would leave the window mostly sky.
    if (!cutLook.k) cutLook.x = box.width / 2 - ground.peak * fit;
    cutLook.k = clamp(cutLook.k || fit, least, 12);
    const wide = section.length * cutLook.k, tall = ground.rows * cutLook.k;
    cutLook.x = clamp(cutLook.x, Math.min(0, box.width - wide), 0);
    // A cut lower than its window sits on the window's bottom line, as on a ground.
    cutLook.y = tall <= box.height ? box.height - tall : clamp(cutLook.y, box.height - tall, 0);
    showNavFrame(box);
    if (!cutFrame) cutFrame = requestAnimationFrame(() => { cutFrame = 0; drawCut(); });
  }

  // The scale that fills the window with the whole height of the cut, and the least one: half of that,
  // never smaller than the whole length in the window. The strip above is there for the rest.
  function cutScales(box) {
    const fit = box.height / cutShown.ground.rows;
    return [fit, Math.min(fit, Math.max(box.width / cutShown.section.length, fit / 2))];
  }

  function drawCut() {
    if (!cutShown) return;
    const { section, cells, ground, play } = cutShown, { crop, rows, floor, surface } = ground;
    const L = section.length, topY = section.minY + section.height - 1;
    const box = cutView.getBoundingClientRect(), ratio = devicePixelRatio, k = cutLook.k;
    cutCanvas.width = Math.round(box.width * ratio); cutCanvas.height = Math.round(box.height * ratio);
    // The blocks in sight, and the chunks they need played.
    const x0 = Math.max(0, Math.floor(-cutLook.x / k)), x1 = Math.min(L, Math.ceil((box.width - cutLook.x) / k));
    const r0 = Math.max(0, Math.floor(-cutLook.y / k)), r1 = Math.min(rows, Math.ceil((box.height - cutLook.y) / k));
    const w = x1 - x0, h = r1 - r0;
    if (w <= 0 || h <= 0) return;
    play.drawChunks((x0 >> 4) - 1, (x1 >> 4) + 1);
    const sheet = new OffscreenCanvas(w, h), brush = sheet.getContext('2d'), image = brush.createImageData(w, h), px = image.data;
    const picked = chosen.section;
    // Seen from afar an ore of one block is lost between two pixels: there it is drawn two blocks wide.
    const reach = k < 0.75 ? 1 : 0;
    for (let r = 0; r < h; r++) for (let x = 0; x < w; x++) {
      const bx = x0 + x, row = crop + r0 + r, y = topY - row, cell = cells[row * L + bx];
      // The sky is the page's own ground; a cave is a hollow, darker than the rock around it.
      if (!cell && y >= surface[bx]) continue;
      const c = !cell ? caveColour : cell === 2 ? cutColours.water : cell === 3 ? cutColours.lava
        : y < floor[bx] && y >= floor[bx] - earthDepth ? cutColours.earth : y < 4 ? cutColours.deep : cutColours.rock;
      const i = (r * w + x) * 4;
      px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2]; px[i + 3] = 255;
    }
    for (let r = 0; r < h; r++) for (let x = 0; x < w; x++) {
      const ore = play.layer[(crop + r0 + r) * L + x0 + x];
      if (!ore || (picked.size && !picked.has(oreKinds[ore - 1]))) continue;
      const c = oreColours[oreKinds[ore - 1]];
      for (let dr = 0; dr <= reach && r + dr < h; dr++) for (let dx = 0; dx <= reach && x + dx < w; dx++) {
        const i = ((r + dr) * w + x + dx) * 4;
        px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2]; px[i + 3] = 255;
      }
    }
    brush.putImageData(image, 0, 0);
    const pen = cutCanvas.getContext('2d');
    pen.imageSmoothingEnabled = false;
    pen.drawImage(sheet, (cutLook.x + x0 * k) * ratio, (cutLook.y + r0 * k) * ratio, w * k * ratio, h * k * ratio);
  }

  // The whole cut drawn small: its rock and its water, from a little under the deepest floor to a little
  // over the highest ground, so the heights are stretched to read. How much is said under it.
  const nav = $('nav'), navCanvas = $('navCanvas'), navFrame = $('navFrame');
  let navRange = null;
  function drawNav() {
    if (!cutShown) return;
    const { section, ground } = cutShown, { surface, floor } = ground, L = section.length;
    const box = nav.getBoundingClientRect(), ratio = devicePixelRatio;
    const width = Math.round(box.width * ratio), height = Math.round(box.height * ratio);
    if (!width || !height) return;
    navCanvas.width = width; navCanvas.height = height;
    const top = ground.top + 6, bottom = Math.max(section.minY, ground.bottom - 20);
    navRange = { top, bottom };
    const brush = navCanvas.getContext('2d'), image = brush.createImageData(width, height), px = image.data;
    const rowOf = y => Math.round((top - y) / (top - bottom) * height);
    for (let col = 0; col < width; col++) {
      const from = Math.floor(col * L / width), to = Math.max(from + 1, Math.floor((col + 1) * L / width));
      let ground = section.minY, water = section.minY;
      for (let x = from; x < to; x++) { ground = Math.max(ground, floor[x]); water = Math.max(water, surface[x]); }
      const rock = clamp(rowOf(ground), 0, height), sea = clamp(rowOf(water), 0, height);
      for (let r = sea; r < height; r++) {
        const c = r < rock ? cutColours.water : cutColours.rock, i = (r * width + col) * 4;
        px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2]; px[i + 3] = 255;
      }
    }
    brush.putImageData(image, 0, 0);
    // How many times the heights are stretched: blocks per pixel along the cut, against blocks per pixel up it.
    const times = (L / box.width) / ((top - bottom) / box.height);
    $('navNote').textContent = text.navNote(times < 1.95 ? num(times, 1) : num(Math.round(times)));
  }
  function showNavFrame(box) {
    if (!navRange) return;
    const { section, ground } = cutShown, k = cutLook.k, L = section.length, width = nav.clientWidth, height = nav.clientHeight;
    const topY = section.minY + section.height - 1 - ground.crop;
    const x0 = clamp(-cutLook.x / k, 0, L), x1 = clamp((box.width - cutLook.x) / k, 0, L);
    // The heights in sight, placed on the strip's own range of heights.
    const yOf = row => topY - row, rowOf = y => (navRange.top - y) / (navRange.top - navRange.bottom) * height;
    const high = cutLook.y >= 0 ? 0 : clamp(rowOf(yOf(-cutLook.y / k)), 0, height);
    const low = clamp(rowOf(yOf((box.height - cutLook.y) / k)), 0, height);
    Object.assign(navFrame.style, { left: `${x0 / L * width}px`, width: `${(x1 - x0) / L * width}px`,
      top: `${high}px`, bottom: `${low >= height - 0.5 ? 0 : height - low}px` });
  }
  // A click on the strip brings the window there; a press that travels carries it along.
  let navCarry = null;
  nav.addEventListener('pointerdown', event => {
    if (event.button !== 0 || !cutShown) return;
    const box = nav.getBoundingClientRect(), frame = navFrame.getBoundingClientRect();
    const inside = event.clientX >= frame.left - 3 && event.clientX <= frame.right + 3;
    const per = cutShown.section.length / box.width;
    navCarry = { per, grip: inside ? event.clientX - frame.left : frame.width / 2 };
    const goTo = clientX => { cutLook.x = -((clientX - navCarry.grip - box.left) * per) * cutLook.k; showCutLook(); };
    navCarry.goTo = goTo;
    if (!inside) goTo(event.clientX);
    nav.setPointerCapture(event.pointerId);
    navFrame.style.cursor = nav.style.cursor = 'grabbing';
  });
  nav.addEventListener('pointermove', event => { if (navCarry) navCarry.goTo(event.clientX); });
  for (const end of ['pointerup', 'pointercancel']) nav.addEventListener(end, () => { navCarry = null; navFrame.style.cursor = nav.style.cursor = ''; });

  // Draws the cut of the section and plays the ores on it, then fills the list of ores.
  async function showCut() {
    const section = world?.section;
    if (!section) { cutShown = null; return; }
    // A new run on the same seed and area often cuts along the same lines. The line that was looked at
    // is then found again, and the place looked at along it kept: a slider moved to see what it does to
    // one hill must not send the view back to the cut's first place at every run.
    if (!section.resumed) {
      section.resumed = true;
      const same = keptCut && section.length === keptCut.length ? section.cuts.findIndex(c => c.z === keptCut.z && c.x === keptCut.x) : -1;
      if (same >= 0) section.at = same;
    }
    const cut = section.cuts[section.at];
    section.cells[section.at] ??= await fetch(`/preview/data/${cut.file}`).then(r => r.arrayBuffer()).then(b => new Uint8Array(b));
    const cells = section.cells[section.at];
    if (world?.section !== section || cells.length !== section.length * section.height) return;
    section.grounds ??= [];
    const ground = section.grounds[section.at] ??= groundOf(section, cells, cut);
    const play = orePlay(section, cells, cut, ground, oreRows ?? rowsOfMods(section));
    const fresh = cutShown?.section !== section || cutShown.cut !== cut;
    const sameLine = keptCut && keptCut.z === cut.z && keptCut.x === cut.x && keptCut.length === section.length;
    cutShown = { section, cut, cells, ground, play, perChunk: play.perChunk };
    keptCut = { z: cut.z, x: cut.x, length: section.length };
    if (fresh) { if (!sameLine) cutLook.k = cutLook.x = cutLook.y = 0; drawNav(); }
    showCutLook(); showOres();
    restProbe();
  }
  // A row typed in plays the ores again, but not on every key: one play at a time, the last value wins.
  let replaying = 0;
  function replayOres() {
    if (view !== 'section' || replaying) return;
    replaying = setTimeout(() => { replaying = 0; drawingCut = showCut(); }, 0);
  }

  function showOres() {
    const { perChunk, section, play } = cutShown, picked = chosen.section;
    [$('listTitle').textContent, $('listColumn').textContent] = text.oreList;
    text.oreColumns.forEach((name, i) => { const head = $('listHead').children[i + 2]; head.textContent = name; head.title = text.oreColumnsHint(num(play.counted)); });
    $('filter').hidden = true;
    $('listHead').hidden = false;
    const figure = v => v == null ? '–' : num(v, 1);
    $('biomes').replaceChildren(...oreKinds.filter(kind => perChunk[kind]).map(kind => {
      const row = document.createElement('button');
      row.className = 'biome num';
      row.innerHTML = '<i></i><span class="name"></span><span class="width"></span><span class="share"></span>';
      row.children[0].style.background = css(oreColours[kind]);
      row.children[1].textContent = text.ores[kind];
      row.children[2].textContent = figure(perChunk[kind].low);
      row.children[3].textContent = figure(perChunk[kind].high);
      row.title = text.oreFrom(perChunk[kind].from.join(', '));
      row.setAttribute('aria-pressed', picked.has(kind));
      row.addEventListener('click', () => { if (!picked.delete(kind)) picked.add(kind); drawCut(); showOres(); });
      return row;
    }));
    $('biomes').classList.toggle('choosing', picked.size > 0);
    const unplayed = section.rules.filter(rule => !rule.playable).length;
    $('pick').replaceChildren(unplayed ? text.oreUnplayed(unplayed) : text.orePickHint);
  }

  // The rows of what is added, in their group on the left: an ore, how many tries a chunk gets, and between
  // which depths. They are built when the preview or their number changes, not while a value is typed.
  function showRows() {
    const section = world?.section;
    groups.ores.box.hidden = !section;
    if (!section) return;
    const rows = oreRows ?? rowsOfMods(section);
    const change = next => { keepRows(next); showRows(); if (view === 'section') drawingCut = showCut(); };
    const action = (label, act, pressed, hint) => {
      const b = document.createElement('button');
      b.textContent = label; b.title = hint || '';
      if (pressed == null) b.className = 'action'; else b.setAttribute('aria-pressed', pressed);
      b.addEventListener('click', act);
      return b;
    };
    const free = oreKinds.filter(kind => !rows.some(row => row.kind === kind) && section.rules.some(rule => rule.kind === kind && rule.playable && !rule.anchored));
    $('addedActions').replaceChildren(
      ...free.map(kind => action(text.addedAdd(text.ores[kind].toLowerCase()), () => change([...rows, { id: `added/${kind}`, kind, count: 2, from: 8, to: 32 }]))),
      ...(rows.length ? [action(text.addedWithout, () => { withoutAdded = !withoutAdded; showRows(); if (view === 'section') drawingCut = showCut(); }, withoutAdded, text.addedWithoutHint)] : []),
      ...(oreRows ? [action(text.addedReset, () => change(null))] : []));
    const head = document.createElement('div');
    head.className = 'ore-row head';
    head.append(...text.addedHead.map((name, i) => {
      const span = document.createElement('span');
      span.textContent = name;
      span.title = i === 2 ? text.addedCountHint : i > 2 && name ? text.addedDepthHint : '';
      return span;
    }));
    $('oreRows').replaceChildren(...(rows.length ? [head] : [text.addedNone]), ...rows.map((row, at) => {
      const line = document.createElement('div');
      line.className = 'ore-row';
      line.innerHTML = '<i></i><span></span><input type="number" min="0" max="64"><input type="number" min="0" max="160"><input type="number" min="0" max="160"><button>×</button>';
      line.children[0].style.background = css(oreColours[row.kind]);
      line.children[1].textContent = text.ores[row.kind];
      line.children[1].title = row.id;
      ['count', 'from', 'to'].forEach((key, i) => {
        const input = line.children[i + 2];
        input.value = row[key];
        input.title = i ? text.addedDepthHint : text.addedCountHint;
        // The rows are not rebuilt while a value is typed, so the field keeps the cursor.
        input.addEventListener('input', () => {
          if (input.value === '' || !(+input.value >= 0)) return;
          keepRows(rows.map((r, j) => j === at ? Object.assign(r, { [key]: Math.round(+input.value) }) : r));
          showRowsNote();
          replayOres();
        });
      });
      line.children[5].title = text.addedRemove;
      line.children[5].addEventListener('click', () => change(rows.filter((_, j) => j !== at)));
      return line;
    }));
    showRowsNote();
  }
  // How many rows differ from the mods' own: changed, added or taken out.
  function showRowsNote() {
    const section = world?.section;
    if (!section) return;
    const mods = rowsOfMods(section), rows = oreRows ?? mods;
    const same = (a, b) => a.id === b.id && a.count === b.count && a.from === b.from && a.to === b.to;
    showNote('ores', rows.filter(row => !mods.some(mod => same(mod, row))).length + mods.filter(mod => !rows.some(row => row.id === mod.id)).length);
  }

  function restCut() {
    if (!cutShown) { $('probe').textContent = ''; return; }
    const { section, cut } = cutShown;
    $('probe').textContent = text.cutRest(section.at + 1, section.cuts.length, num(cut.z), num(cut.x), num(cut.x + section.length));
  }
  $('nextCut').title = text.nextCutHint;
  $('nextCut').addEventListener('click', () => {
    const section = world?.section;
    if (!section) return;
    section.at = (section.at + 1) % section.cuts.length;
    drawingCut = showCut();
  });
  cutView.addEventListener('wheel', event => {
    event.preventDefault();
    if (!cutShown) return;
    const box = cutView.getBoundingClientRect(), px = event.clientX - box.left, py = event.clientY - box.top;
    const k = clamp(cutLook.k * (event.deltaY < 0 ? 1.25 : 0.8), cutScales(box)[1], 12);
    cutLook.x = px - (px - cutLook.x) * k / cutLook.k; cutLook.y = py - (py - cutLook.y) * k / cutLook.k; cutLook.k = k;
    showCutLook();
  }, { passive: false });
  let cutCarry = null;
  cutView.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    cutCarry = { x: event.clientX, y: event.clientY, lookX: cutLook.x, lookY: cutLook.y };
    cutView.setPointerCapture(event.pointerId);
  });
  cutView.addEventListener('pointermove', event => {
    if (cutCarry) {
      cutLook.x = cutCarry.lookX + event.clientX - cutCarry.x; cutLook.y = cutCarry.lookY + event.clientY - cutCarry.y;
      showCutLook();
      return;
    }
    if (!cutShown) return;
    const { section, cut, cells, play, ground } = cutShown, box = cutView.getBoundingClientRect();
    const x = Math.floor((event.clientX - box.left - cutLook.x) / cutLook.k), r = Math.floor((event.clientY - box.top - cutLook.y) / cutLook.k);
    if (x < 0 || x >= section.length || r < 0 || r >= ground.rows) { restCut(); return; }
    const row = ground.crop + r, y = section.minY + section.height - 1 - row, cell = cells[row * section.length + x];
    const ore = play.layer[row * section.length + x];
    const what = ore ? text.ores[oreKinds[ore - 1]] : cell === 1 && y >= ground.floor[x] - earthDepth ? text.cutEarth : text.cutCells[cell];
    const biome = ground.biomes[x >> 4];
    $('probe').textContent = text.cutProbe(num(cut.x + x), y, text.cutDepth(ground.floor[x] - y), what, biome ? pretty(biome) : '');
  });
  for (const end of ['pointerup', 'pointercancel']) cutView.addEventListener(end, () => { cutCarry = null; });
  cutView.addEventListener('mouseleave', restCut);
  addEventListener('resize', () => { if (view === 'section' && cutShown) { drawNav(); showCutLook(); } });

  // ---------- tabs: what the map shows on the left, and its shape on the right, flat or draped over the relief.
  // Two choices of the same kind, each with one answer always lit: nothing here is a switch to turn off.

  // The views a map stopped at a coarser detail cannot give: level land is told 16 blocks apart, and the
  // structures and the cuts come after the full map only.
  const needsFull = ['flat', 'structures', 'section'];
  const coarseMap = () => !!world && !world.sketch && world.step > 16;
  function showTabs() {
    if (coarseMap() && needsFull.includes(view)) { view = 'biomes'; openGroupsFor(view); }
    for (const tab of $('tabs').children) {
      const key = tab.dataset.view;
      tab.disabled = coarseMap() && needsFull.includes(key);
      tab.title = tab.disabled ? text.needsFull : '';
      tab.setAttribute('aria-pressed', key in text.shapes ? (key === 'relief3d') === in3d : key === view);
      // A cut has one shape only.
      if (key in text.shapes) tab.hidden = view === 'section';
    }
    const cut = view === 'section';
    // A preview made before the structures were sampled has none: the view says so instead of a bare map.
    const unmarked = view === 'structures' && !!world && !world.sketch && !world.structures;
    $('frame').classList.toggle('cut', cut);
    $('relief').hidden = !in3d || cut || unmarked;
    $('flat').hidden = cut || unmarked;
    $('cut').hidden = !cut || !world?.section;
    $('nextCut').hidden = !cut || !world?.section;
    map.style.visibility = in3d ? 'hidden' : 'visible';
    $('grid').hidden = in3d || !world || unmarked;
    $('note').textContent = !world ? text.noPreview : cut && !world.section && !world.sketch ? text.noSection : unmarked ? text.noStructures : '';
    // The section's column on the right holds its own figures only: the map's would describe something else.
    $('numbers').classList.toggle('cut', cut);
    $('figuresBlock').hidden = cut;
    if (cut && !world?.section) {
      $('listTitle').textContent = text.oreList[0];
      $('listHead').hidden = $('filter').hidden = true;
      $('biomes').replaceChildren(); $('pick').replaceChildren();
    }
    showCutLine();
    paint();
    restProbe();
  }
  for (const [key, label] of [...Object.entries(text.views), ['section', text.section], ...Object.entries(text.shapes)]) {
    const tab = document.createElement('button');
    tab.textContent = label;
    tab.dataset.view = key;
    if (key === 'flat2d') tab.className = 'apart';
    tab.addEventListener('click', () => {
      if (key in text.shapes) in3d = key === 'relief3d';
      else if (key !== view) { view = key; openGroupsFor(view); }
      showTabs();
      if (world && !world.sketch && !(key in text.shapes)) showList();
    });
    $('tabs').append(tab);
  }
  openGroupsFor(view, false);

  // ---------- generating ----------

  // The steps of a run, under the map: a hairline that fills with the share of the wait gone by, then those
  // done with the second each ended at, and the one under way. The clock itself is beside the button.
  function showSteps(done, current, share) {
    const step = (mark, label, seconds) => {
      const span = document.createElement('span');
      span.className = seconds == null ? 'step now' : 'step';
      span.innerHTML = '<b></b>';
      span.firstChild.textContent = mark;
      span.append(seconds == null ? label : `${label}  ${text.duration(seconds)}`);
      return span;
    };
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.setProperty('--share', share);
    $('steps').replaceChildren(bar, ...done.map(([label, seconds]) => step('✓', label, seconds)), ...(current ? [step('›', current)] : []));
  }

  // Waits for a run with the page: the steps, the sketches, then the map or the trouble. `ended` resolves
  // when the run is over, with `stopped` if someone stopped it, and throws what went wrong. The run is
  // either the one this page asks for, or one found under way on opening, `already` seconds old.
  async function follow(ended, run, already = 0) {
    trouble = said = '';
    busy = true;
    inRun = run;
    // While the run is under way, the button stops it, or starts another in its place.
    $('generate').disabled = false;
    showButton();
    $('status').className = '';
    // The map on screen is about to be replaced: it steps back while the new one is computed.
    $('frame').classList.add('busy');
    const started = Date.now() - already * 1000;
    const seconds =() => Math.round((Date.now() - started) / 1000);
    // Nothing to wait against on a first run at this detail: it is being measured.
    const expected = about(run.samples, run.detail);
    const last = run.detail > 16 ? text.steps.last(run.detail) : text.steps.full;
    // The game starts, sketches land, each finer than the one before, then the full map. How many
    // sketches depends on the area, so each is listed as it lands. Only these landings are known: within
    // a step, the hairline follows the clock against the wait this machine took last time.
    const done = [];
    let stage = text.steps.start;
    const share = () => expected ? Math.min(0.97, seconds() / expected) : 0;
    const tick = () => {
      const elapsed = text.duration(seconds());
      showSteps(done, stage, share());
      $('status').textContent = `${expected ? text.running(elapsed, text.duration(expected)) : text.measuring(elapsed)}${world?.sketch ? ` ${text.steps.readable}` : ''}`;
    };
    const clock = setInterval(tick, 1000);
    tick();
    // The sketches take the map's place. The figures and the list stay those of the map before,
    // stepped back, until the full map is there.
    const old = world;
    let waiting = true, poll = 0;
    const lookForSketch = async () => {
      const sketch = await loadSketch(world?.sketch ? world.step : Infinity).catch(() => null);
      if (!waiting) return;
      poll = setTimeout(lookForSketch, 1000);
      if (!sketch) return;
      world = sketch;
      if (stage === text.steps.start) { done.push([stage, seconds()]); stage = last; }
      done.push([text.steps.sketch(sketch.step), seconds()]);
      $('frame').classList.remove('busy');
      $('numbers').classList.add('stale');
      $('numbers').inert = true;
      showTabs(); restProbe(); tick();
    };
    // The server removes the sketch of the run before as it takes this one: ask a little later.
    poll = setTimeout(lookForSketch, 1000);
    let finished = false, stopped = false;
    try {
      stopped = !!(await ended())?.stopped;
      waiting = false;
      if (!stopped) {
        if (old) {
          before = old.figures;
          try { localStorage.setItem('preview.before', JSON.stringify(before)); } catch { }
        }
        world = await loadWorld();
        finished = true;
      }
    } catch (e) { trouble = e instanceof TypeError ? text.serverGone : e.message || text.failed; }
    waiting = false;
    clearTimeout(poll);
    clearInterval(clock);
    const sketched = !!world?.sketch;
    // A run that failed or was stopped leaves the map it found.
    if (!finished) world = old;
    $('note').textContent = world ? '' : text.noPreview;
    busy = false;
    $('generate').textContent = text.generate;
    $('generate').classList.remove('stop');
    $('frame').classList.remove('busy');
    $('numbers').classList.remove('stale');
    $('numbers').inert = false;
    if (finished) {
      // A small area at a coarse detail has no sketch before its map: the game's start and the map end together.
      done.push([stage === text.steps.start ? last : stage, seconds()]);
      said = text.done(text.duration(seconds()));
      const work = await fetch('/preview/data/timing.json').then(r => r.ok ? r.json() : null).catch(() => null);
      learnPace(run.samples, run.detail, seconds(), work ? work.workMillis / 1000 : null);
      showSpan(); showWorld();
    } else {
      if (stopped) said = text.stopped;
      if (sketched) { if (!world) map.width = map.height = 0; showTabs(); restProbe(); }
    }
    // The steps stay, to see where the time went; the one that did not end is left out.
    showSteps(done, '', finished ? 1 : share());
    inRun = null;
    showButton();
    // A run asked for while this one was under way starts now that it has stopped.
    if (queued) { const next = queued; queued = null; next(); }
  }

  function generate() {
    const tectonic = Object.fromEntries(Object.entries(inputs).map(([key, input]) => [key, +input.value]));
    // An empty seed is one drawn here, so the run can be named and done again.
    const seed = $('seed').value.trim() || String(crypto.getRandomValues(new Uint32Array(1))[0] * 2 ** 20 + crypto.getRandomValues(new Uint32Array(1))[0] % 2 ** 20);
    // Shown at once: the field is what the button compares with the run under way.
    $('seed').value = seed;
    follow(async () => {
      const reply = await fetch('/api/preview', { method: 'POST', body: JSON.stringify({ seed, samples, detail, tectonic }) });
      if (!reply.ok) throw new Error(reply.status === 400 ? text.refused : text.failed);
      return reply.json().catch(() => null);
    }, { seed, samples, detail, values: tectonic });
  }
  $('generate').addEventListener('click', () => {
    if (exporting) return;
    if (busy) {
      // A setting moved: the new run waits for this one to stop, then starts by itself.
      if (!sameAs(inRun)) queued = generate;
      // One press is enough: the run ends a moment later, and the wait for it says so.
      $('generate').disabled = true;
      fetch('/api/preview/stop', { method: 'POST' }).catch(() => { });
      return;
    }
    generate();
  });

  // ---------- export ----------

  // Keeps a try: its settings and figures in one file, and a picture of each view, flat and in 3D, in a
  // folder of the preview's own. The pictures show the whole map, whatever is chosen on screen; the 3D
  // ones are taken from where the relief is looked at now.
  $('export').title = text.exportHint;
  $('export').addEventListener('click', async () => {
    if (!world || world.sketch || busy || exporting) return;
    const stamp = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19).replace('T', '_').replaceAll(':', '-');
    const name = `${shown?.seed ?? 'preview'}_${stamp}`.replace(/[^\w-]/g, '_');
    const send = async (file, body) => {
      const reply = await fetch(`/api/preview/export/${encodeURIComponent(name)}/${file}`, { method: 'POST', body });
      if (!reply.ok) throw new Error(text.exportFailed);
      return reply.json();
    };
    const was = view;
    exporting = true;
    trouble = said = '';
    $('status').className = '';
    $('status').textContent = text.exporting;
    // The export says where it is in the same place as a run does, and takes the place of its steps.
    const started = Date.now(), seconds = () => Math.round((Date.now() - started) / 1000);
    // A preview without structures has no picture of them to give.
    // Nor does a coarser map give its level land.
    const done = [], kinds = Object.keys(text.views).filter(kind => (kind !== 'structures' || world.structures) && !(kind === 'flat' && coarseMap()));
    const step = async label => {
      showSteps(done, label, done.length / (kinds.length + 1));
      // Drawing a wide map holds the page: let it show the step first.
      await new Promise(resolve => setTimeout(resolve, 30));
    };
    let saved = '';
    try {
      const total = world.samples ** 2, lists = {};
      for (const kind of kinds) {
        await step(text.exportStep(text.views[kind]));
        view = kind;
        paint();
        await send(`${kind}.png`, await new Promise(resolve => map.toBlob(resolve)));
        await refresh3d();
        if (scene3d) await send(`${kind}-3d.png`, await scene3d.shot(1600));
        const list = listOf(kind);
        lists[kind] = list.counted
          ? list.ids.map((id, i) => ({ id, name: list.names[i], count: list.cells[i], spacing: Math.round(list.widths[i]) })).filter(row => row.count).sort((a, b) => b.count - a.count)
          : list.ids.map((id, i) => ({ id, name: list.names[i], share: 100 * list.cells[i] / total, width: Math.round(list.widths[i]) }))
            .filter(row => row.share).sort((a, b) => kind === 'biomes' ? b.share - a.share : 0);
        done.push([text.exportStep(text.views[kind]), seconds()]);
      }
      // The cut as it was last looked at: a whole cut as long as the area would be a thread, or wider than a picture may be.
      if (world.section && cutShown && cutCanvas.width) await send('section.png', await new Promise(resolve => cutCanvas.toBlob(resolve)));
      await step(text.exportData);
      const sameSpan = before && before.span === world.figures.span;
      const { folder } = await send('export.json', JSON.stringify({
        seed: shown?.seed, blocks: world.samples * world.step, seaLevel: world.seaLevel,
        tectonic: shown?.values, pack: packValues,
        figures: world.figures, figuresBefore: sameSpan ? before : null, lists, biomesAbsent: world.absent,
        ores: cutShown ? { added: oreRows, perChunk: cutShown.perChunk } : null,
      }, null, 2));
      done.push([text.exportData, seconds()]);
      said = text.exported;
      saved = folder;
    } catch (e) { trouble = e.message || text.exportFailed; }
    view = was;
    exporting = false;
    paint();
    if (saved) showSaved(name, saved); else showSteps(done, '', done.length / (kinds.length + 1));
    showButton();
  });

  // Where an export went, under the map, until it is closed. The page cannot open a folder itself: the
  // server does, and only that export's own folder.
  function showSaved(name, folder) {
    const notice = document.createElement('div'), path = document.createElement('div');
    notice.className = 'saved';
    path.className = 'path';
    path.append(Object.assign(document.createElement('span'), { textContent: text.exportedTo }), folder);
    const button = (label, act) => Object.assign(document.createElement('button'), { textContent: label, onclick: act });
    notice.append(path,
      button(text.openFolder, async () => {
        const reply = await fetch(`/api/preview/export/${encodeURIComponent(name)}/open`, { method: 'POST' }).catch(() => null);
        if (!reply?.ok) say(text.openFailed);
      }),
      button(text.closeNotice, () => $('steps').replaceChildren()));
    $('steps').replaceChildren(notice);
  }
  world = await loadWorld();
  if (world) showWorld(); else showTabs();
  showButton();

  // A window opened while the server computes joins that run: the seed, the area and the sliders are the
  // run's, and the page waits with it. Only the window that asked holds the answer, so this one asks
  // every second whether the run is over.
  const running = await fetch('/api/preview/run').then(r => r.json()).catch(() => null);
  if (running?.running) {
    $('seed').value = running.seed;
    samples = running.samples;
    detail = running.detail ?? 16;
    for (const [key, input] of Object.entries(inputs)) { input.value = running.tectonic[key] ?? packValues[key]; input.dispatchEvent(new Event('input')); }
    showSpan();
    follow(async () => {
      while (true) {
        await new Promise(resolve => setTimeout(resolve, 1000));
        const now = await fetch('/api/preview/run').then(r => r.json());
        if (now.running) continue;
        if (now.error) throw new Error(text.failed);
        return now;
      }
    }, { seed: String(running.seed), samples: running.samples, detail, values: Object.fromEntries(Object.entries(inputs).map(([key, input]) => [key, +input.value])) }, running.seconds);
  }
  scheme.addEventListener('change', paint);

  // A page that reloaded itself because its file changed (see the ping below) comes back as it was left:
  // the values not computed yet, the view, what is chosen, the groups open. Kept for that one reload only,
  // so a reload by hand starts fresh. A run under way keeps its own seed, area and values.
  let left = null;
  try { left = JSON.parse(sessionStorage.getItem('preview.live')); sessionStorage.removeItem('preview.live'); } catch { }
  if (left) {
    if (!running?.running) {
      $('seed').value = left.seed;
      samples = left.samples;
      detail = left.detail;
      for (const [key, input] of Object.entries(inputs)) if (key in left.values) { input.value = left.values[key]; input.dispatchEvent(new Event('input')); }
      showSpan();
    }
    for (const kind in chosen) for (const id of left.chosen[kind] ?? []) chosen[kind].add(id);
    for (const key of [left.view, left.in3d ? 'relief3d' : 'flat2d']) $('tabs').querySelector(`[data-view="${key}"]`)?.click();
    if (world && !world.sketch) { showChoice(); paint(); }
    // After the view, which opens its own groups and moves the list.
    for (const key in groups) if (key in left.open) openGroup(key, left.open[key]);
    $('settings').scrollTop = left.scroll;
  }

  // The address can ask for a state, so a capture gets any view without a click:
  // /?view=height,relief3d&biome=minecraft:desert,minecraft:badlands, or &structure=minecraft:village_plains,surface
  const asked = new URLSearchParams(location.search);
  for (const id of (asked.get('biome') || '').split(',')) if (id) chosen.biomes.add(id);
  // "surface" and "under" stand for every structure of that part, whatever the pack calls them.
  for (const id of (asked.get('structure') || '').split(',')) {
    const part = { surface: false, under: true }[id], s = world?.structures;
    if (part == null) { if (id) chosen.structures.add(id); }
    else if (s) s.ids.forEach((kind, i) => { if (s.under[i] === part && s.count[i]) chosen.structures.add(kind); });
  }
  if (world && chosen.biomes.size) { showChoice(); paint(); }
  if (asked.get('panel')) showPanel(asked.get('panel'));
  for (const key of (asked.get('view') || '').split(',')) $('tabs').querySelector(`[data-view="${key}"]`)?.click();
  // Tells a capture that everything asked for is drawn (see scripts/capture.ps1).
  await drawing3d;
  await drawingCut;
  document.documentElement.dataset.ready = '1';

  // The ping keeps the server alive and brings back when the page file last changed. A change seen twice
  // running is a file whose writing is over: the window then takes the new page, and finds its state again
  // (above). Not while a name is typed, a pointer is held or pictures are taken: it waits for the next ping.
  let pageAt = null, pageSeen = null;
  const leave = () => {
    const typing = /^(text|number)$/.test(document.activeElement?.type ?? '');
    if (typing || naming || exporting || carry || cutCarry || navCarry) return;
    try {
      sessionStorage.setItem('preview.live', JSON.stringify({
        seed: $('seed').value, samples, detail, view, in3d, scroll: $('settings').scrollTop,
        values: Object.fromEntries(Object.entries(inputs).map(([key, input]) => [key, +input.value])),
        chosen: Object.fromEntries(Object.entries(chosen).map(([kind, ids]) => [kind, [...ids]])),
        open: Object.fromEntries(Object.entries(groups).map(([key, group]) => [key, group.button.getAttribute('aria-expanded') === 'true'])),
      }));
    } catch { }
    location.reload();
  };
  const ping = () => fetch('/api/ping').then(r => r.json()).then(({ page }) => {
    // A server started before this page knew of it says nothing: then nothing reloads.
    if (!page) return;
    pageAt ??= page;
    if (page !== pageAt && page === pageSeen) leave();
    pageSeen = page;
  }).catch(() => say(text.serverGone));
  ping();
  setInterval(ping, 2000);
</script>
</body>
</html>
