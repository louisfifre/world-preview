[package]
name = "world-preview"
version = "0.23.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Driver of the world-preview engine: runs a throwaway Fabric server that samples a Minecraft world generator"

[lib]
path = "lib.rs"

[[bin]]
name = "world-preview"
path = "main.rs"

[dependencies]
regex = "1.13.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
